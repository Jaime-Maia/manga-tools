                 opcoes:[{v:"aleatoria", rot:{pt:"Aleatória",        en:"Random"}},
                         {v:"grade",     rot:{pt:"Alinhada (grade)", en:"Aligned (grid)"}}]},
    gradeEsp:   {tipo:"slider", rot:{pt:"Grade: espaçamento",          en:"Grid: spacing"},         min:10, max:300, passo:1, padrao:80,  suf:"px", se:p => p.disposicao === "grade", px:1},
    gradeProp:  {tipo:"slider", rot:{pt:"Grade: proporção linha/coluna",en:"Grid: row/column ratio"}, min:25, max:300, passo:1, padrao:100, suf:"%", se:p => p.disposicao === "grade"},
    gradeAng:   {tipo:"slider", rot:{pt:"Grade: ângulo (diagonal)",    en:"Grid: angle (diagonal)"}, min:0,  max:180, passo:1, padrao:0,   suf:"°", se:p => p.disposicao === "grade"},
    gradeDesl:  {tipo:"slider", rot:{pt:"Grade: deslocar linhas alternadas", en:"Grid: offset alternate rows"}, min:0, max:100, passo:1, padrao:0, suf:"%", se:p => p.disposicao === "grade"},
    gradeDesvio:{tipo:"slider", rot:{pt:"Grade: desvio de posição",    en:"Grid: position jitter"}, min:0,  max:100, passo:1, padrao:0,   suf:"%", se:p => p.disposicao === "grade"},
    variacao:   {tipo:"slider", rot:{pt:"Variação de tamanho e forma (grade)", en:"Size & shape variance (grid)"}, min:0, max:100, passo:1, padrao:0, suf:"%", se:p => p.disposicao === "grade"},
    rotBase:    {tipo:"slider", rot:{pt:"Rotação fixa das figuras",    en:"Fixed shape rotation"},  min:0,  max:360, passo:1, padrao:0,   suf:"°"},
    densidade:  {tipo:"slider", rot:{pt:"Densidade (figuras / 100 mil px²)", en:"Density (shapes / 100k px²)"}, min:1, max:80, passo:1, padrao:8, se:p => p.disposicao !== "grade", px:2},
    tamanhoMin: {tipo:"slider", rot:{pt:"Tamanho mínimo", en:"Min size"}, min:4, max:200, passo:1, padrao:18, suf:"px", px:1},
    tamanhoMax: {tipo:"slider", rot:{pt:"Tamanho máximo", en:"Max size"}, min:6, max:300, passo:1, padrao:60, suf:"px", px:1},
    afastamento:{tipo:"slider", rot:{pt:"Afastamento mínimo", en:"Min spacing"}, min:0, max:150, passo:1, padrao:70, suf:"%", se:p => p.disposicao !== "grade"},
    rotacao:    {tipo:"slider", rot:{pt:"Rotação sorteada",   en:"Random rotation"}, min:0, max:100, passo:1, padrao:60, suf:"%", se:p => p.disposicao !== "grade" || p.variacao > 0},
    anel:       {tipo:"slider", rot:{pt:"Espessura do contorno (bolha/estrela)", en:"Outline width (bubble/star)"},  min:3, max:40,  passo:1, padrao:14, suf:"%", se:p => p.figura === "bolha" || p.figura === "estrelaContorno"},
    degrade:    {tipo:"slider", rot:{pt:"Degradê",            en:"Fade"},            min:0, max:100, passo:1, padrao:0,  suf:"%"},
    anguloGrad: {tipo:"slider", rot:{pt:"Direção do degradê", en:"Fade direction"},  min:0, max:360, passo:1, padrao:0,  suf:"°", se:p => p.degrade > 0}
  },
  gerar(p, W, H, rng){
    const tmin = Math.min(p.tamanhoMin, p.tamanhoMax)/2, tmax = Math.max(p.tamanhoMin, p.tamanhoMax)/2;
    const base = p.rotBase*Math.PI/180;
    if(p.disposicao === "grade"){
      // Grade em coordenadas giradas (u,v) em torno do centro do quadro, devolvidas
      // ao mundo. Com variação 0 todas as figuras saem idênticas (mesmo tamanho,
      // mesma forma); o degradê aqui encolhe as figuras em vez de removê-las, para
      // não abrir buracos na grade.
      const ca = Math.cos(p.gradeAng*Math.PI/180), sa = Math.sin(p.gradeAng*Math.PI/180);
      let dx = p.gradeEsp, dy = p.gradeEsp*p.gradeProp/100;
      const ext = Math.hypot(W,H)/2 + tmax*2;
      const total = (2*ext/dx)*(2*ext/dy);                // máx. ~15 mil figuras
      if(total > 25000){ const k = Math.sqrt(total/25000); dx *= k; dy *= k; }
      const fatorG = gradienteLinear(p.anguloGrad, W, H, 0, 1, 1, 1 - p.degrade/100);
      const vari = p.variacao/100, des = p.gradeDesl/100, dsv = p.gradeDesvio/100;
      const rngFixo = () => 0.5, formas = [];
      for(let j=-Math.ceil(ext/dy); j<=Math.ceil(ext/dy); j++){
        for(let i=-Math.ceil(ext/dx); i<=Math.ceil(ext/dx); i++){
          let u = i*dx + (((j%2)+2)%2)*des*dx, v = j*dy;
          if(dsv > 0){ u += (rng()-0.5)*dx*dsv; v += (rng()-0.5)*dy*dsv; }
          const x = W/2 + u*ca - v*sa, y = H/2 + u*sa + v*ca;
          if(x < -tmax || y < -tmax || x > W+tmax || y > H+tmax) continue;
          const f = fatorG(x,y);
          const R = (tmax - (tmax-tmin)*vari*rng()) * f;
          if(R < 1.5) continue;
          const ang = base + (vari > 0 ? (rng()-0.5)*Math.PI*2*(p.rotacao/100)*vari : 0);   // na grade a rotação sorteada só vale junto com a variação
          for(const fm of figuraAtmosfera(p.figura, x, y, R, ang, p, vari > 0 ? rng : rngFixo)) formas.push(fm);
        }
      }
      return formas;
    }
    const n = Math.min(20000, Math.round(W*H/1e5*p.densidade));
    const sep = p.afastamento/100, rotacao = p.rotacao/100;
    const cel = Math.max(8, 2*tmax*Math.max(1,sep) + 1);
    const fator = gradienteLinear(p.anguloGrad, W, H, 0, 1, 1, 1 - p.degrade/100);
    const grade = new Map(), formas = [];
    let postos = 0, tentativas = 0;
    // Em densidade alta o quadro enche antes de chegar a n; o limite de tentativas
    // faz o efeito simplesmente saturar, em vez de ficar procurando lugar para sempre.
    while(postos < n && tentativas < n*40){
      tentativas++;
      const R = tmin + (tmax-tmin)*Math.pow(rng(), 1.6);          // mais pequenas que grandes
      const x = -tmax + rng()*(W + 2*tmax), y = -tmax + rng()*(H + 2*tmax);
      if(rng() > fator(x,y)) continue;
      const gi = Math.floor((x+tmax)/cel), gj = Math.floor((y+tmax)/cel);
      let livre = true;
      for(let di=-1; di<=1 && livre; di++){
        for(let dj=-1; dj<=1 && livre; dj++){
          const lista = grade.get((gi+di)*100003 + (gj+dj));
          if(!lista) continue;
          for(const q of lista){ if(Math.hypot(x-q[0], y-q[1]) < (R+q[2])*sep){ livre = false; break; } }
        }
      }
      if(!livre) continue;
      const chave = gi*100003 + gj;
      if(!grade.has(chave)) grade.set(chave, []);
      grade.get(chave).push([x,y,R]);
      postos++;
      const ang = base + (rng()-0.5)*Math.PI*2*rotacao;

  const x0 = Math.min(m.ret[0], m.ret[2])*W, x1 = Math.max(m.ret[0], m.ret[2])*W;
  const y0 = Math.min(m.ret[1], m.ret[3])*H, y1 = Math.max(m.ret[1], m.ret[3])*H;
  if(m.tipo === "retangulo") return `M${n(x0)} ${n(y0)} H${n(x1)} V${n(y1)} H${n(x0)} Z`;
  const rx = (x1-x0)/2, ry = (y1-y0)/2, cx = x0+rx, cy = y0+ry;

const invalidar = cam => {
  // a prévia mostra o resultado anterior enquanto o novo é calculado (só se for o mesmo efeito)
  if(cam.formas){ cam.anterior = cam.formas; cam.anteriorEfeito = cam.efeito; }
  cam.formas = null;
};
/* tempo da última geração, guardado por efeito: trocar de efeito não herda o tempo do outro */
function tempoDe(cam){ return cam.tempos ? cam.tempos[cam.efeito] : undefined; }
function anotarTempo(cam, ms){ (cam.tempos || (cam.tempos = {}))[cam.efeito] = ms; }

/* ---- Cálculo em segundo plano (Web Worker) -------------------------
   Efeitos pesados (retícula fina em B5, granulado denso, kakeami cheio)
   levam segundos para gerar. Eles vão para um Worker, montado a partir do
   próprio texto do <script id="nucleo">, então funciona offline, sem
   arquivo separado. Enquanto calcula, a prévia mostra o resultado anterior
   e os controles continuam respondendo. O Worker atende um pedido por vez;
   se o controle mudou nesse meio-tempo, só o valor mais recente é pedido. */
const TRABALHO = {w:null, ocupado:null, esperando:new Map(), espera:new Map()};
(function criarWorker(){
  try{
    const codigo = document.getElementById("nucleo").textContent + `
self.onmessage = e => {
  const {chave, efeito, params, W, H, semente} = e.data;
  try{
    const t0 = performance.now();
    const lote = empacotar(EFEITOS[efeito].gerar(params, W, H, mulberry32(semente)));
    self.postMessage({chave, lote, tempo:performance.now() - t0}, transferiveis(lote));
  }catch(err){ self.postMessage({chave, erro:String(err && err.message || err)}); }
};`;
    const url = URL.createObjectURL(new Blob([codigo], {type:"text/javascript"}));
    const w = new Worker(url);
    w.onmessage = e => {
      const {chave, lote, tempo, erro} = e.data;
      TRABALHO.ocupado = null;
      if(lote) guardar(chave, lote, tempo);
      const ok = TRABALHO.espera.get(chave);
      if(ok){ TRABALHO.espera.delete(chave); ok.forEach(f => f(!erro)); }
      for(const cam of S.camadas) if(!cam.formas && chaveDe(cam) === chave && lote){ cam.formas = lote; anotarTempo(cam, tempo); cam.chave = chave; }
      proximoTrabalho();
      indicarCalculo();
      redesenhar();
    };
    // Se o Worker falhar (navegador que bloqueia Worker em arquivo local, por
    // exemplo), tudo volta a ser calculado na página e quem esperava é liberado.
    w.onerror = () => {
      TRABALHO.w = null; TRABALHO.ocupado = null; TRABALHO.esperando.clear();
      for(const fs of TRABALHO.espera.values()) fs.forEach(f => f(false));
      TRABALHO.espera.clear();
      indicarCalculo(); redesenhar();
    };
    TRABALHO.w = w;
  }catch(e){ TRABALHO.w = null; }
})();
function proximoTrabalho(){
  if(!TRABALHO.w || TRABALHO.ocupado) return;
  // pedidos esperados pela exportação vêm primeiro; depois, as camadas visíveis
  let job = null;
  for(const [chave, j] of TRABALHO.esperando){ TRABALHO.esperando.delete(chave); if(!CACHE.has(chave)){ job = j; break; } }
  if(!job){
    for(const cam of S.camadas){
      if(!cam.visivel || cam.formas) continue;
      const chave = chaveDe(cam);
      if(CACHE.has(chave)){ doCache(cam); continue; }
      job = {chave, efeito:cam.efeito, params:cam.params, W:S.W, H:S.H, semente:cam.semente};
      break;
    }
  }
  if(!job) return;
  TRABALHO.ocupado = job.chave;
  TRABALHO.w.postMessage(job);
  indicarCalculo();
}
/* Deve ir para o Worker? Sim se a última geração desta camada passou de
   40 ms, ou, sem histórico, se o documento é grande. */
function usarWorker(cam){
  if(!TRABALHO.w) return false;
  const t = tempoDe(cam);
  return t === undefined ? S.W*S.H > 3000000 : t > 40;
}
/* Formas para a prévia: prontas, do cache, geradas na hora (leves) ou,
   para as pesadas, o resultado anterior enquanto o Worker calcula. */
function formasPrevia(cam){
  if(cam.formas) return cam.formas;
  if(doCache(cam)) return cam.formas;
  if(!usarWorker(cam)) return formasDa(cam);
  proximoTrabalho();
  return cam.anteriorEfeito === cam.efeito ? cam.anterior : null;
}
/* Garante que as camadas estejam calculadas antes de exportar. */
function garantir(lista){
  const promessas = [];
  for(const cam of lista){
    if(!cam.visivel || cam.formas || doCache(cam)) continue;
    if(!usarWorker(cam)){ formasDa(cam); continue; }
    const chave = chaveDe(cam);
    promessas.push(new Promise(ok => {
      if(!TRABALHO.espera.has(chave)) TRABALHO.espera.set(chave, []);
      TRABALHO.espera.get(chave).push(ok);
      if(TRABALHO.ocupado !== chave)
        TRABALHO.esperando.set(chave, {chave, efeito:cam.efeito, params:JSON.parse(JSON.stringify(cam.params)), W:S.W, H:S.H, semente:cam.semente});
    }).then(deuCerto => { if(!deuCerto) formasDa(cam); }));
  }
  proximoTrabalho();
  return Promise.all(promessas);
}
function calculando(){ return !!TRABALHO.ocupado || S.camadas.some(c => c.visivel && !c.formas && !CACHE.has(chaveDe(c)) && usarWorker(c)); }
function indicarCalculo(){ const el = document.getElementById("calc"); if(el) el.hidden = !calculando(); }

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* ---- Vista da prévia ------------------------------------------
   O canvas da prévia tem o tamanho do espaço na tela, não do documento.
   Um B5 a 350 dpi (ou 6000 × 6000) não cabe no limite de memória de
   imagem do Safari do iPad; a prévia nunca chega perto dele, e o arquivo
   em tamanho real só é montado na exportação.
   k = pixels de tela (CSS) por pixel do documento; ox, oy = posição do
   canto do documento na tela. */
const palco = document.getElementById("palco");
const VISTA = {modo:"ajustar", k:1, ox:0, oy:0, cw:1, ch:1, dpr:1};
const ZOOM_MAX = 16;
function margemVista(){ return matchMedia("(pointer:coarse)").matches ? 16 : 24; }
function kAjustado(){
  const m = margemVista();
  return Math.max(0.005, Math.min((VISTA.cw - 2*m)/S.W, (VISTA.ch - 2*m)/S.H));
}
function ajustarVista(){
  VISTA.modo = "ajustar";
  VISTA.k = kAjustado();
  VISTA.ox = (VISTA.cw - S.W*VISTA.k)/2;
  VISTA.oy = (VISTA.ch - S.H*VISTA.k)/2;
}
function limitarVista(){
  // Sempre sobra um pedaço do quadro à vista, para ninguém se perder.
  const b = 48, w = S.W*VISTA.k, h = S.H*VISTA.k;
  VISTA.ox = Math.min(VISTA.cw - b, Math.max(b - w, VISTA.ox));
  VISTA.oy = Math.min(VISTA.ch - b, Math.max(b - h, VISTA.oy));
}
function zoomEm(k, sx, sy){
  const kMin = Math.min(kAjustado(), 0.05);
  k = Math.max(kMin, Math.min(ZOOM_MAX, k));
  if(sx === undefined){ sx = VISTA.cw/2; sy = VISTA.ch/2; }
  VISTA.ox = sx - (sx - VISTA.ox)*k/VISTA.k;
  VISTA.oy = sy - (sy - VISTA.oy)*k/VISTA.k;
  VISTA.k = k; VISTA.modo = "livre";
  limitarVista(); redesenhar();
}
const PASSOS_ZOOM = [0.05,0.1,0.15,0.25,0.33,0.5,0.67,1,1.5,2,3,4,6,8,12,16];
function zoomPasso(dir){
  const k = VISTA.k;
  const prox = dir > 0 ? PASSOS_ZOOM.find(z => z > k*1.01) : [...PASSOS_ZOOM].reverse().find(z => z < k*0.99);
  zoomEm(prox || (dir > 0 ? ZOOM_MAX : k/1.25));
}
function medirPalco(){
  const r = palco.getBoundingClientRect();
  VISTA.cw = Math.max(1, r.width); VISTA.ch = Math.max(1, r.height);
  VISTA.dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(VISTA.cw*VISTA.dpr); cv.height = Math.round(VISTA.ch*VISTA.dpr);
  if(VISTA.modo === "ajustar") ajustarVista(); else limitarVista();
}
let padraoXadrez = null;
function xadrez(){
  if(padraoXadrez) return padraoXadrez;
  const p = document.createElement("canvas"), d = Math.round(8*VISTA.dpr);
  p.width = p.height = d*2;
  const x = p.getContext("2d");
  x.fillStyle = "#eef0f3"; x.fillRect(0,0,d*2,d*2);
  x.fillStyle = "#cfd2d8"; x.fillRect(0,0,d,d); x.fillRect(d,d,d,d);
  return padraoXadrez = ctx.createPattern(p, "repeat");
}
const EFEITOS_TOM = new Set(["reticula","reticulaGrad","linhas","padroes","kakeami","kakeamiGrad","pontilhado","granulado"]);

function desenhar(){
  const {k, ox, oy, dpr} = VISTA;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const x = ox, y = oy, w = S.W*k, h = S.H*k;
  ctx.save();
  ctx.shadowColor = "#0009"; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  ctx.fillStyle = S.fundo === "preto" ? "#000" : "#fff";
  ctx.fillRect(x, y, w, h);
  ctx.restore();
  if(S.fundo === "xadrez"){
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = xadrez();
    ctx.fillRect(Math.round(x*dpr), Math.round(y*dpr), Math.round(w*dpr), Math.round(h*dpr));
    ctx.restore();
  }
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.setTransform(dpr*k, 0, 0, dpr*k, dpr*ox, dpr*oy);
  if(REF.img && REF.visivel && REF.pos !== "acima") desenharReferencia(ctx);
  // área do documento que está na tela (para pular formas invisíveis)
  const vis = [-ox/k, -oy/k, (VISTA.cw-ox)/k, (VISTA.ch-oy)/k];
  let temTom = false;
  for(const cam of S.camadas){
    if(!cam.visivel) continue;
    if(EFEITOS_TOM.has(cam.efeito)) temTom = true;
    desenharCamada(ctx, cam, vis, true);
  }
  if(REF.img && REF.visivel && REF.pos === "acima") desenharReferencia(ctx);
  ctx.restore();
  desenharSobreposicaoArea();
  indicarCalculo();
  posicionarAlvo();
  $("z-val").textContent = (k >= 0.1 ? Math.round(k*100) : (k*100).toFixed(1)) + "%";
  // A ondulação aparece quando um pixel do arquivo fica menor que um pixel físico da tela.
  $("aviso-ret").hidden = !(temTom && k*dpr < 0.98);
}

let pendente = false;
function redesenhar(){
  if(pendente) return;
  pendente = true;
  requestAnimationFrame(() => { pendente = false; desenhar(); });
}

/* ---- PNG em faixas -------------------------------------------
   O Safari do iPad recusa imagens acima de ~16,7 milhões de pixels (B5 a
   350 dpi em 2× tem 35 milhões). Acima desse limite, a imagem é desenhada
   em faixas horizontais pequenas e montada direto em PNG: cada faixa vira
   linhas de pixels que passam pelo compressor do próprio navegador
   (CompressionStream), sem nunca existir uma imagem inteira na memória. */
const LIMITE_CANVAS = 16000000;
const CRC_TAB = (() => { const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(partes){
  let c = 0xFFFFFFFF;
  for(const p of partes) for(let i=0;i<p.length;i++) c = CRC_TAB[(c ^ p[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function blocoPNG(tipo, dados){
  const cab = new Uint8Array(8), t = new TextEncoder().encode(tipo);
  new DataView(cab.buffer).setUint32(0, dados.length);
  cab.set(t, 4);
  const fim = new Uint8Array(4);
  new DataView(fim.buffer).setUint32(0, crc32([t, dados]));
  return [cab, dados, fim];
}
function nomeCamada(cam){ return cam.nome || L(EFEITOS[cam.efeito].nome); }
function nomeArquivo(cam, i){
  const base = nomeCamada(cam).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return `${String(i+1).padStart(2, "0")}-${base || "camada"}`;
}
/* Bloco pHYs: a resolução em pixels por metro. É o que faz o Clip Studio,
   o Photoshop e a impressão abrirem o B5 já no tamanho físico certo. */
function blocoPHYs(dpi){
  const d = new Uint8Array(9), v = new DataView(d.buffer), ppm = Math.round(dpi/0.0254);
  v.setUint32(0, ppm); v.setUint32(4, ppm); d[8] = 1;
  return blocoPNG("pHYs", d);
}
async function comDpi(blob, dpi){
  const b = new Uint8Array(await blob.arrayBuffer());
  // assinatura (8) + IHDR (25): o pHYs entra logo depois
  return new Blob([b.subarray(0, 33), ...blocoPHYs(dpi), b.subarray(33)], {type:"image/png"});
}
function desenharCamadas(x, vis, lista = S.camadas){
  for(const cam of lista){
    if(!cam.visivel) continue;
    desenharCamada(x, cam, vis);
  }
}
async function pngEmFaixas(escala, fundoBranco, progresso, lista){
  const w = Math.round(S.W*escala), h = Math.round(S.H*escala);
  const altFaixa = Math.max(1, Math.floor(4000000 / w));
  const c = document.createElement("canvas");
  c.width = w; c.height = Math.min(h, altFaixa);
  const x = c.getContext("2d", {willReadFrequently:true});
  const cs = new CompressionStream("deflate");          // "deflate" = formato zlib, o que o PNG usa
  const escritor = cs.writable.getWriter(), partes = [];
  const leitura = (async () => {
    const r = cs.readable.getReader();
    for(;;){ const {value, done} = await r.read(); if(done) break; partes.push(value); }
  })();
  for(let y0=0; y0<h; y0+=altFaixa){
    const linhas = Math.min(altFaixa, h - y0);
    x.setTransform(1,0,0,1,0,0);
    x.clearRect(0,0,c.width,c.height);
    if(fundoBranco){ x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); }
    x.setTransform(escala,0,0,escala,0,-y0);
    desenharCamadas(x, [0, y0/escala, S.W, (y0+linhas)/escala], lista);
    const px = x.getImageData(0,0,w,linhas).data, lw = w*4;
    const bruto = new Uint8Array(linhas*(lw+1));
    for(let j=0;j<linhas;j++){ bruto[j*(lw+1)] = 0; bruto.set(px.subarray(j*lw,(j+1)*lw), j*(lw+1)+1); }
    await escritor.write(bruto);
    if(progresso) progresso(Math.min(99, Math.round((y0+linhas)/h*100)));
    await new Promise(r => setTimeout(r, 0));              // deixa a tela respirar
  }
  await escritor.close(); await leitura;
  const ihdr = new Uint8Array(13), dv = new DataView(ihdr.buffer);
  dv.setUint32(0, w); dv.setUint32(4, h); ihdr[8] = 8; ihdr[9] = 6;     // 8 bits, RGBA
  const blocos = [new Uint8Array([137,80,78,71,13,10,26,10]), ...blocoPNG("IHDR", ihdr), ...blocoPHYs(S.dpi*escala)];
  for(const p of partes) blocos.push(...blocoPNG("IDAT", p));
  blocos.push(...blocoPNG("IEND", new Uint8Array(0)));
  return new Blob(blocos, {type:"image/png"});
}
/* Devolve uma promessa do PNG: canvas direto quando cabe, faixas quando não. */
function gerarPNG(escala, fundoBranco, lista = S.camadas){
  return garantir(lista).then(() => gerarPNGPronto(escala, fundoBranco, lista));
}
function gerarPNGPronto(escala, fundoBranco, lista){
  const w = Math.round(S.W*escala), h = Math.round(S.H*escala);
  if(w*h > (window.__LIMITE_CANVAS || LIMITE_CANVAS)){
    if(typeof CompressionStream === "undefined") return Promise.reject(new Error("grande"));
    return pngEmFaixas(escala, fundoBranco, p => statusFixo(T("gerando").replace("{}", p)), lista);
  }
  return new Promise((ok, falha) => {
    paraCanvas(escala, fundoBranco, lista).toBlob(b => b ? comDpi(b, S.dpi*escala).then(ok, () => ok(b)) : falha(new Error("grande")), "image/png");
  });
}

function construirSVG(fundoBranco){
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${S.W}" height="${S.H}" viewBox="0 0 ${S.W} ${S.H}">`;
  if(fundoBranco) s += `<rect width="${S.W}" height="${S.H}" fill="#ffffff"/>`;
  S.camadas.forEach((cam, i) => {
    if(!cam.visivel) return;
    // O id vira o nome da camada no Figma, no Illustrator e no Inkscape.
    const nome = nomeArquivo(cam, i);
    const d = caminhoMascara(cam.mascara, S.W, S.H);
    let g = formasParaSVG(formasDa(cam), cam.cor, cam.opacidade).replace("<g ", `<g id="${nome}" `);
    if(d){
      s += `<clipPath id="area-${i+1}"><path d="${d}" clip-rule="evenodd"/></clipPath>`;
      g = `<g id="${nome}-area" clip-path="url(#area-${i+1})">${g}</g>`;
    }
    s += g;
  });
  return s + "</svg>";
}

function paraCanvas(escala, fundoBranco, lista = S.camadas){
  const c = document.createElement("canvas");
  c.width = Math.round(S.W*escala); c.height = Math.round(S.H*escala);
  const x = c.getContext("2d");
  if(fundoBranco){ x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); }
  x.scale(escala, escala);
  desenharCamadas(x, null, lista);
  return c;
}

const $ = id => document.getElementById(id);

function statusMsg(txt){
  $("status").textContent = txt;
  clearTimeout(statusMsg._t);
  statusMsg._t = setTimeout(() => { $("status").textContent = ""; }, 4000);
}

/* --- Botões de tipo --- */
function montarTipos(){
  const box = $("tipos"); box.innerHTML = "";
  box.classList.toggle("recolhido", !!S.tiposRecolhidos);
  for(const id of ORDEM){
    const ef = EFEITOS[id];
    const b = document.createElement("button");
    b.className = "tipo" + (camAtual().efeito === id ? " on" : "");
    b.innerHTML = `<svg viewBox="0 0 34 26">${ef.icone}</svg><span>${L(ef.nome)}</span>`;
    b.onclick = () => {
      const c = camAtual(), agora = Date.now();
      if(c.efeito === id){
        // Clique no efeito já escolhido: dois seguidos recolhem/expandem a lista.
        // O contador é manual porque os botões são recriados a cada clique.
        if(montarTipos._ult && agora - montarTipos._ult < 450){
          montarTipos._ult = 0;
          recolherTipos(!box.classList.contains("recolhido"));
        } else montarTipos._ult = agora;
        return;
      }
      montarTipos._ult = 0;
      c.efeito = id; c.params = padroesDe(id); invalidar(c);
      montarTudo(); redesenhar(); salvar();
    };
    b.title = T("dicaTipo");
    box.appendChild(b);
  }
}
function recolherTipos(sim){
  S.tiposRecolhidos = sim;
  $("tipos").classList.toggle("recolhido", sim);
  statusMsg(T(sim ? "tiposRecolhidos" : "tiposExpandidos"));
  salvar();
}

/* --- Sliders e seletores, gerados a partir de params --- */
function fmtNum(v){
  return Number(v).toLocaleString(LANG === "pt" ? "pt-BR" : "en-US", {maximumFractionDigits: Math.abs(v) < 10 ? 2 : 1});
}
function textoValor(d, v){
  let t = fmtNum(v) + (d.suf || "");
  if(d.lpi) t += " · " + T("linhasL").replace("{}", fmtNum(S.dpi / v));
  return t;
}
/* Controles que só valem para certa escolha (ex.: os da grade do Mood) declaram
   `se: p => ...` e ficam escondidos quando não se aplicam. O valor guardado não
   muda; ele só volta a aparecer quando a opção volta. */
function visiveis(ef, p){
  return Object.entries(ef.params).filter(([k,d]) => !d.se || d.se(p)).map(([k]) => k).join(",");
}
function talvezRemontar(c){
  const ef = EFEITOS[c.efeito];
  if(montarCtls._vis !== visiveis(ef, c.params)) montarCtls();
}
function montarCtls(){
  const box = $("ctls"); box.innerHTML = "";
  const c = camAtual();
  const ef = EFEITOS[c.efeito];
  montarCtls._vis = visiveis(ef, c.params);
  for(const [chave, d] of Object.entries(ef.params)){
    if(d.se && !d.se(c.params)) continue;
    if(d.tipo === "slider"){
      const div = document.createElement("div"); div.className = "ctl";
      div.innerHTML = `<div class="top"><label class="reset">${L(d.rot)}</label><span class="val edit" tabindex="0" role="button"></span></div>`;
      const val = div.querySelector(".val"), rot = div.querySelector("label");
      const mostrar = () => { val.textContent = textoValor(d, c.params[chave]); };
      mostrar();
      const inp = document.createElement("input");
      // Valores vindos de um documento maior podem passar do limite original do controle.
      inp.type = "range"; inp.min = Math.min(d.min, c.params[chave]); inp.max = Math.max(d.max, c.params[chave]); inp.step = d.passo;
      inp.value = c.params[chave];
      inp.setAttribute("aria-label", L(d.rot));
      inp.oninput = () => {
        c.params[chave] = parseFloat(inp.value);
        mostrar();
        invalidar(c);
        if(c.pesado && !TRABALHO.w) statusMsg(T("pesado")); else redesenhar();
      };
      inp.onchange = () => { redesenhar(); salvar(); talvezRemontar(c); if(d.lpi) montarCtls(); };
      const definir = v => {
        c.params[chave] = v; invalidar(c);
        montarCtls(); redesenhar(); salvar();
      };
      // tocar no número abre um campo para digitar o valor exato
      const editar = () => {
        if(val.querySelector("input")) return;
        const ed = document.createElement("input");
        ed.type = "number"; ed.step = "any"; ed.value = c.params[chave];
        val.textContent = ""; val.appendChild(ed); ed.focus(); ed.select();
        let feito = false;
        const fim = ok => {
          if(feito) return; feito = true;
          const v = parseFloat(String(ed.value).replace(",", "."));
          const hi = d.px ? d.max*8 : d.max;
          if(ok && isFinite(v)) definir(Math.max(d.px === 2 ? 0.01 : d.min*(d.px ? 0.1 : 1), Math.min(hi, v)));
          else mostrar();
        };
        ed.onkeydown = e => { if(e.key === "Enter") fim(true); if(e.key === "Escape") fim(false); e.stopPropagation(); };
        ed.onblur = () => fim(true);
      };
      val.onclick = editar;
      val.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); editar(); } };
      // dois toques no nome do controle voltam ao padrão
      rot.ondblclick = () => definir(padroesDe(c.efeito)[chave]);
      rot.title = T("dicaValor");
      div.appendChild(inp);
      if(d.lpi){
        // lineatura: como as retículas são vendidas (60 L = 60 linhas por polegada)
        const lin = document.createElement("div"); lin.className = "linha c2 dpi"; lin.style.marginTop = "8px";
        const lab = document.createElement("label"); lab.textContent = T("lineatura");
        const sel = document.createElement("select");
        const atualL = S.dpi / c.params[chave];
        let achou = false;
        const op0 = document.createElement("option"); op0.value = ""; op0.textContent = T("personalizada"); sel.appendChild(op0);
        for(const Lv of [27.5, 32.5, 42.5, 50, 55, 60, 65, 70, 75, 85]){
          const o = document.createElement("option"); o.value = Lv; o.textContent = T("linhasL").replace("{}", fmtNum(Lv));
          if(Math.abs(atualL - Lv) < 0.25){ o.selected = true; achou = true; }
          sel.appendChild(o);
        }
        if(!achou) op0.selected = true;
        sel.onchange = () => { if(sel.value) definir(arred(S.dpi / parseFloat(sel.value))); };
        lin.append(lab, sel); div.appendChild(lin);
      }
      box.appendChild(div);
    } else if(d.tipo === "opcoes"){
      const div = document.createElement("div"); div.className = "ctl";
      div.innerHTML = `<div class="top"><label>${L(d.rot)}</label></div>`;
      const sel = document.createElement("select");
      sel.style.width = "100%";
      for(const o of d.opcoes){
        const op = document.createElement("option");
        op.value = o.v; op.textContent = L(o.rot);
        if(c.params[chave] === o.v) op.selected = true;
        sel.appendChild(op);
      }
      sel.onchange = () => { c.params[chave] = sel.value; invalidar(c); redesenhar(); salvar(); talvezRemontar(c); };
      div.appendChild(sel); box.appendChild(div);
    } else if(d.tipo === "ponto"){
      const dica = document.createElement("div");
      dica.className = "dica"; dica.textContent = T("arraste");
      box.appendChild(dica);
    }
  }
  // Opacidade da camada
  const div = document.createElement("div"); div.className = "ctl";
  div.innerHTML = `<div class="top"><label>${T("opacidade")}</label>
                   <span class="val">${Math.round(c.opacidade*100)}%</span></div>`;
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = 5; inp.max = 100; inp.step = 1; inp.value = c.opacidade*100;
  inp.oninput = () => {
    c.opacidade = parseFloat(inp.value)/100;
    div.querySelector(".val").textContent = inp.value + "%";
    redesenhar();
  };
  inp.onchange = salvar;
  div.appendChild(inp); box.appendChild(div);
}

/* --- Imagem de referência ---
   Fica por baixo (ou por cima, em multiplicar) só na prévia. A imagem vai
   para o IndexedDB do navegador (o localStorage não comporta uma página
   escaneada); as escolhas de opacidade e encaixe vão com o resto. */
const REF = {img:null, blob:null, opac:50, pos:"abaixo", encaixe:"caber", visivel:true};
function bancoRef(){
  return new Promise((ok, falha) => {
    const r = indexedDB.open("gerador-efeitos", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("arquivos");
    r.onsuccess = () => ok(r.result); r.onerror = () => falha(r.error);
  });
}
async function guardarRef(blob){
  try{
    const db = await bancoRef();
    await new Promise((ok, falha) => {
      const t = db.transaction("arquivos", "readwrite");
      if(blob) t.objectStore("arquivos").put(blob, "referencia"); else t.objectStore("arquivos").delete("referencia");
      t.oncomplete = ok; t.onerror = () => falha(t.error);
    });
  }catch(e){}
}
async function lerRef(){
  try{
    const db = await bancoRef();
    return await new Promise(ok => {
      const r = db.transaction("arquivos").objectStore("arquivos").get("referencia");
      r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
    });
  }catch(e){ return null; }
}
async function abrirRef(blob, guardar){
  try{
    const img = await createImageBitmap(blob);
    REF.img = img; REF.blob = blob; REF.visivel = true;
    if(guardar) await guardarRef(blob);
    montarRef(); redesenhar(); gravar();
  }catch(e){ statusMsg(T("refErro")); }
}
function desenharReferencia(x){
  const im = REF.img, iw = im.width, ih = im.height;
  let w = S.W, h = S.H, px = 0, py = 0;
  if(REF.encaixe !== "esticar"){
    const k = REF.encaixe === "preencher" ? Math.max(S.W/iw, S.H/ih) : Math.min(S.W/iw, S.H/ih);
    w = iw*k; h = ih*k; px = (S.W-w)/2; py = (S.H-h)/2;
  }
  x.save();
  x.globalAlpha = REF.opac/100;
  if(REF.pos === "acima") x.globalCompositeOperation = "multiply";
  x.imageSmoothingQuality = "high";
  x.drawImage(im, px, py, w, h);
  x.restore();
}
function montarRef(){
  const box = $("ref-ctls"); box.innerHTML = "";
  $("b-ref-carregar").textContent = T(REF.img ? "refTrocar" : "refCarregar");
  $("b-ref-remover").disabled = !REF.img;
  if(!REF.img) return;
  const lab = document.createElement("label"); lab.className = "chk"; lab.style.marginTop = "12px";
  const chk = document.createElement("input"); chk.type = "checkbox"; chk.checked = REF.visivel; chk.id = "ref-visivel";
  chk.onchange = () => { REF.visivel = chk.checked; redesenhar(); gravar(); };
  lab.append(chk, document.createTextNode(T("refVisivel"))); box.appendChild(lab);
  const sl = document.createElement("div"); sl.className = "ctl";
  sl.innerHTML = `<div class="top"><label>${T("refOpac")}</label><span class="val">${REF.opac}%</span></div>`;
  const inp = document.createElement("input"); inp.type = "range"; inp.min = 5; inp.max = 100; inp.step = 1; inp.value = REF.opac; inp.id = "ref-opac";
  inp.oninput = () => { REF.opac = +inp.value; sl.querySelector(".val").textContent = inp.value + "%"; redesenhar(); };
  inp.onchange = gravar;
  sl.appendChild(inp); box.appendChild(sl);
  for(const [rot, chave, ops] of [["refPos","pos",[["abaixo","refAbaixo"],["acima","refAcima"]]],
                                  ["refEnc","encaixe",[["caber","refCaber"],["preencher","refPreencher"],["esticar","refEsticar"]]]]){
    const d = document.createElement("div"); d.className = "ctl";
    d.innerHTML = `<div class="top"><label>${T(rot)}</label></div>`;
    const sel = document.createElement("select"); sel.style.width = "100%"; sel.id = "ref-" + chave;
    for(const [v,k] of ops){ const o = document.createElement("option"); o.value = v; o.textContent = T(k); sel.appendChild(o); }
    sel.value = REF[chave];
    sel.onchange = () => { REF[chave] = sel.value; redesenhar(); gravar(); };
    d.appendChild(sel); box.appendChild(d);
  }
  const iw = REF.img.width, ih = REF.img.height;
  if(iw !== S.W || ih !== S.H){
    const b = document.createElement("button"); b.className = "b"; b.style.width = "100%"; b.id = "ref-tamanho";
    b.textContent = T("refTamanho").replace("{}", `${iw} × ${ih}`);
    b.onclick = () => {
      const k = Math.min(1, 6000/Math.max(iw, ih));          // o documento vai até 6000 px
      aplicarTamanho(iw*k, ih*k); montarRef();
    };
    box.appendChild(b);
  }
}
$("b-ref-carregar").onclick = () => $("ref-arquivo").click();
$("ref-arquivo").onchange = e => { const f = e.target.files[0]; if(f) abrirRef(f, true); e.target.value = ""; };
$("b-ref-remover").onclick = () => { REF.img = null; REF.blob = null; guardarRef(null); montarRef(); redesenhar(); gravar(); };

/* --- Meus presets ---
   Um preset guarda as camadas (efeito, ajustes, cor, opacidade, área e
   semente) e o tamanho em que foi salvo. Ao aplicar num documento de outro
   tamanho, os valores em pixels são ajustados como numa troca de tamanho.
   Exportar/importar leva os presets entre o computador e o iPad. */
const CHAVE_PRESETS = "gerador-efeitos-presets-v1";
function lerPresets(){ try{ const v = JSON.parse(localStorage.getItem(CHAVE_PRESETS) || "[]"); return Array.isArray(v) ? v : []; }catch(e){ return []; } }
function gravarPresets(l){ try{ localStorage.setItem(CHAVE_PRESETS, JSON.stringify(l)); }catch(e){} }
function camadaParaDados(c){
  return JSON.parse(JSON.stringify({efeito:c.efeito, params:c.params, cor:c.cor, opacidade:c.opacidade,
    visivel:c.visivel, semente:c.semente, mascara:c.mascara, nome:c.nome || ""}));
}
function dadosParaCamada(d){
  const base = novaCamada(d.efeito);
  return Object.assign(base, d, {params:Object.assign(base.params, d.params), formas:null, caixas:null,
                                 mascara:Object.assign(mascaraPadrao(), d.mascara || {})});
}
function presetValido(p){
  return p && typeof p.nome === "string" && Array.isArray(p.camadas) && p.camadas.length > 0 && p.camadas.length <= 8
      && p.camadas.every(c => c && EFEITOS[c.efeito]) && p.W > 0 && p.H > 0;
}
function montarPresetsUsuario(){
  const sel = $("p-lista"), l = lerPresets(), atual = sel.value;
  sel.innerHTML = "";
  if(!l.length){ const o = document.createElement("option"); o.value = ""; o.textContent = T("pVazio"); sel.appendChild(o); }
  l.forEach((p, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `${p.nome} (${p.camadas.length})`; sel.appendChild(o); });
  if(atual && l[atual]) sel.value = atual;
  $("p-aplicar").disabled = $("p-apagar").disabled = !l.length;
  $("p-exportar").disabled = !l.length;
}
$("p-salvar").onclick = () => {
  const nome = $("p-nome").value.trim();
  if(!nome){ statusMsg(T("pSemNome")); $("p-nome").focus(); return; }
  const l = lerPresets(), p = {nome, W:S.W, H:S.H, dpi:S.dpi, camadas:S.camadas.map(camadaParaDados)};
  const i = l.findIndex(x => x.nome === nome);
  if(i >= 0) l[i] = p; else l.push(p);
  gravarPresets(l); montarPresetsUsuario();
  $("p-lista").value = String(i >= 0 ? i : l.length-1);
  statusMsg(T(i >= 0 ? "pAtualizado" : "pSalvo").replace("{}", nome));
};
$("p-aplicar").onclick = () => {
  const p = lerPresets()[parseInt($("p-lista").value, 10)];
  if(!p) return;
  const r = Math.min(S.W, S.H)/Math.min(p.W, p.H);
  S.camadas = p.camadas.map(d => { const c = dadosParaCamada(d); escalarParams(c.efeito, c.params, r); return c; });
  S.atual = S.camadas.length - 1;
  montarTudo(); redesenhar(); salvar();
  statusMsg(T("pAplicado").replace("{}", p.nome));
};
$("p-apagar").onclick = () => {
  const l = lerPresets(), i = parseInt($("p-lista").value, 10);
  if(!l[i]) return;
  const nome = l[i].nome; l.splice(i, 1);
  gravarPresets(l); montarPresetsUsuario(); statusMsg(T("pApagado").replace("{}", nome));
};
$("p-exportar").onclick = () => {
  const dados = {formato:"gerador-efeitos-presets", versao:1, presets:lerPresets()};
  baixar(new Blob([JSON.stringify(dados, null, 1)], {type:"application/json"}), `presets-efeitos-${carimbo()}.json`);
};
$("p-importar").onclick = () => $("p-arquivo").click();
$("p-arquivo").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    const novos = (Array.isArray(d) ? d : d.presets || []).filter(presetValido);
    if(!novos.length) throw new Error();
    const l = lerPresets();
    for(const p of novos){ const i = l.findIndex(x => x.nome === p.nome); if(i >= 0) l[i] = p; else l.push(p); }
    gravarPresets(l); montarPresetsUsuario();
    statusMsg(T("pImportados").replace("{}", novos.length));
  }catch(err){ statusMsg(T("pInvalido")); }
};

/* --- Lista de camadas --- */
/* A lista mostra a camada de cima no topo, como no Photoshop e no Figma.
   Na memória, S.camadas[0] é a de baixo (desenhada primeiro). */
function montarCamadas(){
  const box = $("camadas"); box.innerHTML = "";
  const n = S.camadas.length;
  const botao = (txt, dica, fn, off) => {
    const b = document.createElement("button");
    b.className = "ic"; b.textContent = txt; b.disabled = !!off;
    b.title = dica; b.setAttribute("aria-label", dica);
    b.onclick = fn; return b;
  };
  for(let i=n-1; i>=0; i--){
    const cam = S.camadas[i];
    const el = document.createElement("div");
    el.className = "cam" + (i === S.atual ? " on" : "") + (cam.visivel ? "" : " off");
    el.onclick = e => {
      if(e.target.closest("input,button")) return;
      if(S.atual !== i){ S.atual = i; montarTudo(); redesenhar(); }
    };
    const cor = document.createElement("input");
    cor.type = "color"; cor.value = cam.cor; cor.setAttribute("aria-label", T("camCor")); cor.title = T("camCor");
    cor.oninput = () => { cam.cor = cor.value; redesenhar(); };
    cor.onchange = salvar;

    const nome = document.createElement("span");
    nome.className = "nome"; nome.title = T("camRenomear");
    nome.textContent = `${i+1}. ${nomeCamada(cam)}`;
    if(mascaraAtiva(cam.mascara)){
      const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = " ◩";
      tag.title = T("areaTag"); tag.setAttribute("aria-label", T("areaTag")); nome.appendChild(tag);
    }
    nome.ondblclick = () => {
      const ed = document.createElement("input");
      ed.type = "text"; ed.className = "renomear"; ed.maxLength = 40; ed.value = nomeCamada(cam);
      ed.setAttribute("aria-label", T("camRenomear"));
      nome.replaceWith(ed); ed.focus(); ed.select();
      let feito = false;
      const fim = ok => {
        if(feito) return; feito = true;
        const v = ed.value.trim();
        if(ok) cam.nome = (v && v !== L(EFEITOS[cam.efeito].nome)) ? v : "";
        montarCamadas(); if(ok) salvar();
      };
      ed.onkeydown = e => { e.stopPropagation(); if(e.key === "Enter") fim(true); if(e.key === "Escape") fim(false); };
      ed.onblur = () => fim(true);
    };

    const olho = botao(cam.visivel ? "👁" : "🚫", T("camOlho"), () => { cam.visivel = !cam.visivel; montarCamadas(); redesenhar(); salvar(); });
    olho.setAttribute("aria-pressed", String(cam.visivel));
    const trocar = (a, b) => {
      [S.camadas[a], S.camadas[b]] = [S.camadas[b], S.camadas[a]];
      S.atual = b; montarTudo(); redesenhar(); salvar();
    };
    const sobe = botao("↑", T("camSobe"), () => { if(i < n-1) trocar(i, i+1); }, i === n-1);
    const desce = botao("↓", T("camDesce"), () => { if(i > 0) trocar(i, i-1); }, i === 0);
    const dup = botao("⧉", T("camDup"), () => {
      if(S.camadas.length >= 8){ statusMsg(T("limite")); return; }
      const copia = Object.assign(novaCamada(cam.efeito), JSON.parse(JSON.stringify({
        params:cam.params, cor:cam.cor, opacidade:cam.opacidade, visivel:cam.visivel, semente:cam.semente,
        mascara:cam.mascara, nome:cam.nome || ""})));
      S.camadas.splice(i+1, 0, copia);
      S.atual = i+1; montarTudo(); redesenhar(); salvar();
    }, n >= 8);
    const apaga = botao("✕", T("camApaga"), () => {
      if(S.camadas.length === 1) return;
      S.camadas.splice(i,1);
      S.atual = Math.min(S.atual, S.camadas.length-1);
      montarTudo(); redesenhar(); salvar();
    }, n === 1);

    el.append(cor, nome, olho, sobe, desce, dup, apaga);
    box.appendChild(el);
  }
}

/* --- Centro arrastável, arraste da vista e zoom por gesto --- */
function temCentro(){
  return "centro" in EFEITOS[camAtual().efeito].params;
}
function posicionarAlvo(){
  const a = $("alvo");
  if(!temCentro()){ a.style.display = "none"; return; }
  const p = camAtual().params.centro;
  a.style.display = "block";
  a.style.left = (VISTA.ox + p[0]*S.W*VISTA.k) + "px";
  a.style.top  = (VISTA.oy + p[1]*S.H*VISTA.k) + "px";
}
const ponteiros = new Map();
let gesto = null, espaco = false;

/* ---- Edição da área na prévia ---- */
const AREA = {editando:false, desenhando:false, hover:null, ultimoToque:null};
function areaEditavel(){
  const m = camAtual().mascara;
  return AREA.editando && m && m.tipo !== "nenhuma";
}
function paraDoc(p){ return [(p[0]-VISTA.ox)/VISTA.k/S.W, (p[1]-VISTA.oy)/VISTA.k/S.H]; }
function paraTela(n){ return [VISTA.ox + n[0]*S.W*VISTA.k, VISTA.oy + n[1]*S.H*VISTA.k]; }
function raioToque(e){ return e && e.pointerType === "touch" ? 22 : 11; }
function alcasDe(m){
  if(m.tipo === "poligono") return m.pts.map(p => p.slice());
  const [x0,y0,x1,y1] = m.ret;
  return [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
}
function dentroDaArea(m, n){
  const t = new Path2D(caminhoForma(m, 1, 1));
  return ctx.isPointInPath(t, n[0], n[1], "evenodd");
}
function distSegmento(p, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx + dy*dy || 1;
  const t = Math.max(0, Math.min(1, ((p[0]-a[0])*dx + (p[1]-a[1])*dy)/L2));
  return Math.hypot(p[0]-a[0]-t*dx, p[1]-a[1]-t*dy);
}
function iniciarGestoArea(e){
  const c = camAtual(), m = c.mascara, p = pontoNoPalco(e), n = paraDoc(p), r = raioToque(e);
  const copia = JSON.stringify(m);
  if(AREA.desenhando) return {tipo:"areaPonto", p0:p, copia};
  const alcas = alcasDe(m);
  for(let i=0;i<alcas.length;i++){
    const q = paraTela(alcas[i]);
    if(Math.hypot(q[0]-p[0], q[1]-p[1]) <= r) return {tipo:"areaAlca", i, p0:p, copia};
  }
  if(m.tipo === "poligono"){
    for(let i=0;i<m.pts.length;i++){
      const a = paraTela(m.pts[i]), b = paraTela(m.pts[(i+1)%m.pts.length]);
      if(distSegmento(p, a, b) <= r*0.8) return {tipo:"areaAresta", i, p0:p, n, copia};
    }
  }
  if(mascaraAtiva(m) && dentroDaArea(m, n)) return {tipo:"areaMover", n0:n, copia};
  if(m.tipo !== "poligono") return {tipo:"areaNova", n0:n, copia};
  return null;
}
function limitarN(v){ return Math.max(-0.5, Math.min(1.5, v)); }
function moverGestoArea(g, e){
  const m = camAtual().mascara, p = pontoNoPalco(e), n = paraDoc(p).map(limitarN);
  if(g.tipo === "areaAlca"){
    if(m.tipo === "poligono") m.pts[g.i] = n;
    else {
      const i = g.i;
      if(i === 0 || i === 3) m.ret[0] = n[0]; else m.ret[2] = n[0];
      if(i === 0 || i === 1) m.ret[1] = n[1]; else m.ret[3] = n[1];
    }
  } else if(g.tipo === "areaMover"){
    const o = JSON.parse(g.copia), dx = n[0]-g.n0[0], dy = n[1]-g.n0[1];
    m.ret = [o.ret[0]+dx, o.ret[1]+dy, o.ret[2]+dx, o.ret[3]+dy];
    m.pts = o.pts.map(q => [q[0]+dx, q[1]+dy]);
  } else if(g.tipo === "areaNova"){
    m.ret = [g.n0[0], g.n0[1], n[0], n[1]];
  } else return;
  redesenhar();
}
function soltarGestoArea(g, e){
  const c = camAtual(), m = c.mascara, p = pontoNoPalco(e), n = paraDoc(p);
  const andou = g.p0 ? Math.hypot(p[0]-g.p0[0], p[1]-g.p0[1]) : 99;
  const agora = performance.now(), ult = AREA.ultimoToque;
  const duplo = (alvo) => ult && agora - ult.t < 400 && ult.alvo === alvo && Math.hypot(p[0]-ult.p[0], p[1]-ult.p[1]) < 24;
  if(g.tipo === "areaPonto"){
    if(andou > 8) return;
    if(m.pts.length >= 3){
      const q = paraTela(m.pts[0]);
      if(Math.hypot(q[0]-p[0], q[1]-p[1]) <= raioToque(e)){ concluirDesenho(); return; }
    }
    m.pts.push(n);
    redesenhar(); montarArea(); salvar();
    return;
  }
  if(g.tipo === "areaAlca" && m.tipo === "poligono" && andou < 6){
    if(duplo("v" + g.i) && m.pts.length > 3){
      m.pts.splice(g.i, 1); AREA.ultimoToque = null;
      redesenhar(); salvar(); return;
    }
    AREA.ultimoToque = {t:agora, alvo:"v" + g.i, p};
    return;
  }
  if(g.tipo === "areaAresta"){
    if(andou < 6 && duplo("a" + g.i)){
      m.pts.splice(g.i+1, 0, g.n); AREA.ultimoToque = null;
      redesenhar(); salvar(); return;
    }
    AREA.ultimoToque = {t:agora, alvo:"a" + g.i, p};
    return;
  }
  if(m.tipo !== "poligono"){
    m.ret = [Math.min(m.ret[0],m.ret[2]), Math.min(m.ret[1],m.ret[3]), Math.max(m.ret[0],m.ret[2]), Math.max(m.ret[1],m.ret[3])];
    // área minúscula (um toque fora, sem arrastar): volta ao que era
    if((m.ret[2]-m.ret[0])*S.W < 6 || (m.ret[3]-m.ret[1])*S.H < 6) Object.assign(m, JSON.parse(g.copia));
  }
  redesenhar(); salvar();
}
function concluirDesenho(){
  const m = camAtual().mascara;
  if(m.pts.length < 3){ statusMsg(T("areaFaltam")); return; }
  AREA.desenhando = false; AREA.hover = null;
  montarArea(); redesenhar(); salvar();
}
/* Contorno da área da camada atual (não é exportado) e, na edição, as alças. */
function desenharSobreposicaoArea(){
  const m = camAtual().mascara;
  if(!m || m.tipo === "nenhuma") return;
  const {dpr} = VISTA;
  ctx.save();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const tela = q => paraTela(q);
  ctx.beginPath();
  if(m.tipo === "poligono"){
    m.pts.forEach((q,i) => { const t = tela(q); i ? ctx.lineTo(t[0],t[1]) : ctx.moveTo(t[0],t[1]); });
    if(AREA.desenhando && AREA.hover && m.pts.length){ const h = AREA.hover; ctx.lineTo(h[0], h[1]); }
    else if(m.pts.length >= 3) ctx.closePath();
  } else {
    const a = tela([Math.min(m.ret[0],m.ret[2]), Math.min(m.ret[1],m.ret[3])]);
    const b = tela([Math.max(m.ret[0],m.ret[2]), Math.max(m.ret[1],m.ret[3])]);
    if(m.tipo === "retangulo") ctx.rect(a[0], a[1], b[0]-a[0], b[1]-a[1]);
    else ctx.ellipse((a[0]+b[0])/2, (a[1]+b[1])/2, Math.abs(b[0]-a[0])/2, Math.abs(b[1]-a[1])/2, 0, 0, Math.PI*2);
  }
  ctx.lineWidth = 3; ctx.strokeStyle = "#000a"; ctx.setLineDash([]); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#ff7a45"; ctx.setLineDash([7,5]); ctx.stroke();
  ctx.setLineDash([]);
  if(areaEditavel()){
    const toque = matchMedia("(pointer:coarse)").matches, lado = toque ? 14 : 9;
    alcasDe(m).forEach((q,i) => {
      const t = tela(q);
      ctx.fillStyle = "#fff"; ctx.strokeStyle = "#ff7a45"; ctx.lineWidth = 2;
      if(m.tipo === "poligono" && i === 0 && AREA.desenhando){
        ctx.beginPath(); ctx.arc(t[0], t[1], lado*0.8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      } else {
        ctx.fillRect(t[0]-lado/2, t[1]-lado/2, lado, lado); ctx.strokeRect(t[0]-lado/2, t[1]-lado/2, lado, lado);
      }
    });
  }
  ctx.restore();
}
function pontoNoPalco(e){ const r = palco.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function moverCentro(e){
  const [sx, sy] = pontoNoPalco(e), c = camAtual();
  c.params.centro = [(sx - VISTA.ox)/VISTA.k/S.W, (sy - VISTA.oy)/VISTA.k/S.H];

function iniciarPinca(){
  // um gesto de área interrompido pelo segundo dedo é desfeito
  if(gesto && gesto.copia && gesto.tipo.startsWith("area")) Object.assign(camAtual().mascara, JSON.parse(gesto.copia));
  const [a, b] = [...ponteiros.values()];
  gesto = {tipo:"pinca", d0:Math.hypot(b[0]-a[0], b[1]-a[1]) || 1,
           m0:[(a[0]+b[0])/2, (a[1]+b[1])/2], k0:VISTA.k, ox0:VISTA.ox, oy0:VISTA.oy,
           moveuCentro: gesto && gesto.tipo === "centro"};
}
cv.addEventListener("pointerdown", e => {
  if(e.pointerType === "mouse" && e.button === 2) return;
  cv.setPointerCapture(e.pointerId);
  ponteiros.set(e.pointerId, pontoNoPalco(e));
  if(ponteiros.size === 2){ iniciarPinca(); return; }
  if(ponteiros.size > 2) return;
  if(e.button !== 1 && !espaco && areaEditavel()){
    const g = iniciarGestoArea(e);
    if(g){ gesto = g; return; }
  }
  const panear = e.button === 1 || espaco || !temCentro() || areaEditavel();
  if(panear){
    e.preventDefault();
    gesto = {tipo:"pan", p0:pontoNoPalco(e), ox0:VISTA.ox, oy0:VISTA.oy};
    cv.classList.add("puxando");
  } else if(e.pointerType === "touch"){
    // No toque, o centro só se move quando fica claro que é um dedo só:
    // se o segundo dedo chegar logo (pinça), o centro não sai do lugar.
    gesto = {tipo:"centroPendente", p0:pontoNoPalco(e), t0:performance.now()};
  } else {
    gesto = {tipo:"centro"};
    moverCentro(e);
  }
});
cv.addEventListener("pointermove", e => {
  if(AREA.desenhando && e.pointerType !== "touch"){ AREA.hover = pontoNoPalco(e); if(!ponteiros.size) redesenhar(); }
  if(!ponteiros.has(e.pointerId)) return;
  ponteiros.set(e.pointerId, pontoNoPalco(e));
  if(!gesto) return;
  if(gesto.tipo === "pinca" && ponteiros.size >= 2){
    const [a, b] = [...ponteiros.values()];
    const d = Math.hypot(b[0]-a[0], b[1]-a[1]) || 1, m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
    const k = Math.max(Math.min(kAjustado(), 0.05), Math.min(ZOOM_MAX, gesto.k0*d/gesto.d0));
    VISTA.ox = m[0] - (gesto.m0[0] - gesto.ox0)*k/gesto.k0;
    VISTA.oy = m[1] - (gesto.m0[1] - gesto.oy0)*k/gesto.k0;
    VISTA.k = k; VISTA.modo = "livre"; limitarVista(); redesenhar();
  } else if(gesto.tipo === "pan"){
    const p = pontoNoPalco(e);
    VISTA.ox = gesto.ox0 + p[0] - gesto.p0[0];
    VISTA.oy = gesto.oy0 + p[1] - gesto.p0[1];
    VISTA.modo = "livre"; limitarVista(); redesenhar();
  } else if(gesto.tipo.startsWith("area")){
    moverGestoArea(gesto, e);
  } else if(gesto.tipo === "centro"){
    moverCentro(e);
  } else if(gesto.tipo === "centroPendente"){
    const p = pontoNoPalco(e);
    if(Math.hypot(p[0]-gesto.p0[0], p[1]-gesto.p0[1]) > 8 || performance.now() - gesto.t0 > 180){
      gesto = {tipo:"centro"}; moverCentro(e);
    }
  }
});
function soltar(e){
  if(!ponteiros.has(e.pointerId)) return;
  ponteiros.delete(e.pointerId);
  if(ponteiros.size > 0){ if(gesto && gesto.tipo === "pinca") gesto = {tipo:"fim", moveuCentro:gesto.moveuCentro}; return; }
  const g = gesto; gesto = null;
  cv.classList.remove("puxando");
  if(g && g.tipo === "centroPendente" && e.type === "pointerup"){ moverCentro(e); salvar(); return; }   // toque rápido
  if(g && g.tipo.startsWith("area") && e.type === "pointerup"){ soltarGestoArea(g, e); return; }
  if(g && (g.tipo === "centro" || g.moveuCentro)) salvar();
}
cv.addEventListener("pointerup", soltar);

async function baixar(blob, nome){
  // Quando a página roda como artefato publicado, o download direto é bloqueado;
  // a capacidade "downloads" abre a confirmação (no iPad, a folha de compartilhar).
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(dl){
      try{ await dl.save({filename:nome, data:blob}); statusMsg(T("salvo") + " " + nome); }
      catch(e){ if(!e || e.code !== "declined") statusMsg(T("erroSalvar")); }
      return;
    }
  }catch(e){}
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  statusMsg(T("salvo") + " " + nome);
}
function carimbo(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
/* ---- ZIP com uma imagem por camada ----------------------------------
   Formato ZIP mais simples ("store", sem recompressão: o PNG já vem
   comprimido). Cada camada visível sai inteira, no tamanho do documento,
   com a própria área, cor e opacidade, mais a composição de todas. */
function montarZip(arquivos){
  const enc = new TextEncoder(), partes = [], central = [];
  let pos = 0;
  for(const a of arquivos){
    const nome = enc.encode(a.nome), crc = crc32([a.dados]), n = a.dados.length;
    const loc = new Uint8Array(30 + nome.length), v = new DataView(loc.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true);   // UTF-8
    v.setUint16(8, 0, true); v.setUint16(10, 0, true); v.setUint16(12, 0x21, true);              // 01/01/1980
    v.setUint32(14, crc, true); v.setUint32(18, n, true); v.setUint32(22, n, true);
    v.setUint16(26, nome.length, true); v.setUint16(28, 0, true); loc.set(nome, 30);
    const cen = new Uint8Array(46 + nome.length), w = new DataView(cen.buffer);
    w.setUint32(0, 0x02014b50, true); w.setUint16(4, 20, true); w.setUint16(6, 20, true); w.setUint16(8, 0x0800, true);
    w.setUint16(10, 0, true); w.setUint16(12, 0, true); w.setUint16(14, 0x21, true);
    w.setUint32(16, crc, true); w.setUint32(20, n, true); w.setUint32(24, n, true);
    w.setUint16(28, nome.length, true); w.setUint32(42, pos, true); cen.set(nome, 46);
    partes.push(loc, a.dados); central.push(cen);
    pos += loc.length + n;
  }
  const tamCentral = central.reduce((t, c) => t + c.length, 0);
  const fim = new Uint8Array(22), z = new DataView(fim.buffer);
  z.setUint32(0, 0x06054b50, true); z.setUint16(8, arquivos.length, true); z.setUint16(10, arquivos.length, true);
  z.setUint32(12, tamCentral, true); z.setUint32(16, pos, true);
  return new Blob([...partes, ...central, fim], {type:"application/zip"});
}
async function exportarZip(){
  if(exportando) return;
  exportando = true;
  try{
    const vis = S.camadas.map((c, i) => [c, i]).filter(([c]) => c.visivel);
    const tarefas = [...vis.map(([c, i]) => ({nome:nomeArquivo(c, i) + ".png", lista:[c]})),
                     {nome:"00-" + T("composicao") + ".png", lista:S.camadas}];
    const arquivos = [];
    for(let k=0; k<tarefas.length; k++){
      statusFixo(T("gerandoZip").replace("{}", k+1).replace("{}", tarefas.length));
      const b = await gerarPNG(S.escala, false, tarefas[k].lista);
      arquivos.push({nome:tarefas[k].nome, dados:new Uint8Array(await b.arrayBuffer())});
      await new Promise(r => setTimeout(r, 0));
    }
    await baixar(montarZip(arquivos), `efeito-${carimbo()}.zip`);
  }catch(e){ statusMsg(T("erroGrande")); }
  finally{ exportando = false; }
}

/* O Safari só aceita copiar se a cópia começar no mesmo toque do botão.
   Por isso a imagem entra no ClipboardItem como promessa, ainda sendo
   gerada; o Chrome também aceita assim. Navegadores antigos que não
   aceitam promessa recebem a imagem pronta numa segunda tentativa. */
async function copiarPNG(fundoBranco){
  if(exportando) return;
  exportando = true;
  const prom = gerarPNG(S.escala, fundoBranco);
  try{
    try{
      await navigator.clipboard.write([new ClipboardItem({"image/png": prom})]);
    }catch(e){
      const b = await prom;
      await navigator.clipboard.write([new ClipboardItem({"image/png": b})]);
    }
    statusMsg(T("copiado"));
  }catch(e){
    statusMsg(T(e && e.message === "grande" ? "erroGrande" : "erroCopia"));
  }finally{ exportando = false; }
}
$("b-copiar-t").onclick = () => copiarPNG(false);

  montarTudo(); redesenhar(); salvar();
};
$("idioma").onchange = e => { LANG = e.target.value; aplicarIdioma(); montarTudo(); salvar(); };
$("fundo").onchange = e => {
  S.fundo = e.target.value;
  redesenhar(); salvar();
};
$("escala").onchange = e => { S.escala = parseFloat(e.target.value); salvar(); };
$("preset").onchange = e => {
  if(e.target.value === "x") return;
  const p = PRESETS[parseInt(e.target.value,10)];
  if(p.dpi){ S.dpi = p.dpi; $("dpi").value = S.dpi; }
  aplicarTamanho(p.w, p.h);
};
function mostrarMedida(){
  const mm = v => fmtNum(Math.round(v/S.dpi*25.4));
  $("medida").textContent = T("medida").replace("{}", `${mm(S.W)} × ${mm(S.H)}`).replace("{}", S.dpi);
}
$("dpi").onchange = () => {
  const v = parseInt($("dpi").value, 10);
  if(isFinite(v)) S.dpi = Math.max(72, Math.min(1200, v));
  $("dpi").value = S.dpi;
  mostrarMedida(); montarCtls(); salvar();
};
$("manter").onchange = e => { S.manter = e.target.checked; gravar(); };
function aplicarTamanho(w,h){
  const antes = Math.min(S.W, S.H);
  S.W = Math.max(64, Math.min(6000, Math.round(w)));
  S.H = Math.max(64, Math.min(6000, Math.round(h)));
  if(S.manter){
    const r = Math.min(S.W, S.H)/antes;
    for(const cam of S.camadas) escalarParams(cam.efeito, cam.params, r);
    montarCtls();
  }
  mostrarMedida();
  $("larg").value = S.W; $("alt").value = S.H;
  S.camadas.forEach(invalidar);
  ajustarVista();
  montarPresets(); redesenhar(); salvar();
  if(REF.img) montarRef();
}
$("larg").onchange = () => aplicarTamanho(parseInt($("larg").value,10)||S.W, S.H);
$("alt").onchange  = () => aplicarTamanho(S.W, parseInt($("alt").value,10)||S.H);

/* ============================================================
   10. PERSISTÊNCIA (localStorage)
   ============================================================ */
/* ---- Histórico (desfazer / refazer) ----------------------------
   Cada vez que algo é salvo, guarda-se um retrato do documento (tamanho e
   camadas). Idioma, fundo da prévia e escala de exportação ficam de fora:
   são preferências da tela, não do desenho. */
const HIST = {pilha:[], i:-1, max:100};
function retrato(){
  return JSON.stringify({W:S.W, H:S.H, dpi:S.dpi, atual:S.atual, camadas:S.camadas.map(c => ({
    efeito:c.efeito, params:c.params, cor:c.cor, opacidade:c.opacidade, visivel:c.visivel, semente:c.semente, mascara:c.mascara, nome:c.nome || ""}))});
}
function registrar(){
  const r = retrato();
  if(HIST.pilha[HIST.i] === r) return;
  HIST.pilha = HIST.pilha.slice(0, HIST.i+1);
  HIST.pilha.push(r);
  if(HIST.pilha.length > HIST.max) HIST.pilha.shift();
  HIST.i = HIST.pilha.length - 1;
  botoesHistorico();
}
function botoesHistorico(){
  $("b-desfazer").disabled = HIST.i <= 0;
  $("b-refazer").disabled = HIST.i >= HIST.pilha.length - 1;
}
function aplicarRetrato(r){
  const d = JSON.parse(r), mudouTamanho = d.W !== S.W || d.H !== S.H;
  S.W = d.W; S.H = d.H; S.dpi = d.dpi || S.dpi; $("dpi").value = S.dpi; mostrarMedida();
  S.camadas = d.camadas.map(c => Object.assign(novaCamada(c.efeito), c, {formas:null, caixas:null}));
  S.atual = Math.min(d.atual, S.camadas.length - 1);
  $("larg").value = S.W; $("alt").value = S.H;
  if(mudouTamanho) ajustarVista();
  if(AREA.desenhando && camAtual().mascara.tipo !== "poligono") AREA.desenhando = false;
  montarPresets(); montarTudo(); redesenhar();
  gravar(); botoesHistorico();
}
function desfazer(){
  if(HIST.i <= 0) return;
  HIST.i--; aplicarRetrato(HIST.pilha[HIST.i]); statusMsg(T("desfeito"));
}
function refazer(){
  if(HIST.i >= HIST.pilha.length - 1) return;
  HIST.i++; aplicarRetrato(HIST.pilha[HIST.i]); statusMsg(T("refeito"));
}
/* ---- Ajuda ----
   Abre sozinha no primeiro uso; depois, pelo botão "?". Enquanto aberta, o
   foco fica preso dentro dela (Tab circula) e os atalhos da página param. */
const CHAVE_AJUDA = "gerador-efeitos-ajuda-vista";
function textoVersao(){
  const [a, m, d] = DATA_VERSAO.split("-");
  return T("versao").replace("{}", VERSAO).replace("{}", LANG === "pt" ? `${d}/${m}/${a}` : DATA_VERSAO);
}
let focoAntes = null;
function montarAjuda(){
  $("ajuda-conteudo").innerHTML = T("ajuda");
  const v = document.createElement("small"); v.id = "ajuda-versao"; v.textContent = textoVersao();
  v.style.cssText = "display:block; margin-top:6px";
  $("ajuda-conteudo").querySelector(".rodape small").appendChild(v);
  $("ajuda-ok").onclick = fecharAjuda;
}
function abrirAjuda(){
  focoAntes = document.activeElement;
  montarAjuda();
  $("ajuda").hidden = false;
  $("ajuda-ok").focus({preventScroll:true});     // o foco fica no botão, mas o texto começa do topo
  $("ajuda-conteudo").scrollTop = 0;
}
function fecharAjuda(){
  $("ajuda").hidden = true;
  try{ localStorage.setItem(CHAVE_AJUDA, "1"); }catch(e){}
  (focoAntes && focoAntes !== document.body && focoAntes.focus ? focoAntes : $("b-ajuda")).focus();
}
$("b-ajuda").onclick = abrirAjuda;
$("ajuda").addEventListener("click", e => { if(e.target === $("ajuda")) fecharAjuda(); });
$("ajuda").addEventListener("keydown", e => {
  e.stopPropagation();
  if(e.key === "Escape"){ e.preventDefault(); fecharAjuda(); return; }
  if(e.key !== "Tab") return;
  const f = [...$("ajuda").querySelectorAll("a[href],button")];
  const i = f.indexOf(document.activeElement);
  if(e.shiftKey && i <= 0){ e.preventDefault(); f[f.length-1].focus(); }
  else if(!e.shiftKey && i === f.length-1){ e.preventDefault(); f[0].focus(); }
});

$("b-desfazer").onclick = desfazer;
$("b-refazer").onclick = refazer;
window.addEventListener("keydown", e => {
  if(!$("ajuda").hidden) return;
  // Espaço segurado = mão para mover a vista (como no Photoshop e no Figma).
  // Vale com o foco na página ou na prévia; nos controles do painel, o
  // espaço continua acionando o botão focado.
  if(e.key === " " && (e.target === document.body || e.target.closest("#palco"))){
    e.preventDefault();
    if(!e.repeat){ espaco = true; cv.classList.add("mao"); }
    return;
  }
  if(AREA.desenhando && !e.target.closest("input,select,textarea")){
    if(e.key === "Enter"){ e.preventDefault(); concluirDesenho(); return; }
    if(e.key === "Backspace"){ e.preventDefault(); camAtual().mascara.pts.pop(); redesenhar(); salvar(); return; }
  }
  if(e.key === "Escape" && AREA.editando){
    AREA.editando = AREA.desenhando = false; AREA.hover = null; montarArea(); redesenhar(); return;
  }
  if(!(e.ctrlKey || e.metaKey)) return;
  if(e.target.closest("input[type=number],input[type=text],textarea")) return;
  const k = e.key.toLowerCase();
  if(k === "z" && !e.shiftKey){ e.preventDefault(); desfazer(); }
  else if((k === "z" && e.shiftKey) || k === "y"){ e.preventDefault(); refazer(); }
  else if(k === "0"){ e.preventDefault(); ajustarVista(); redesenhar(); }
  else if(k === "1"){ e.preventDefault(); zoomEm(1); }
  else if(k === "=" || k === "+"){ e.preventDefault(); zoomPasso(1); }
  else if(k === "-"){ e.preventDefault(); zoomPasso(-1); }
});
window.addEventListener("keyup", e => {
  if(e.key !== " " || !espaco) return;
  e.preventDefault();                 // não deixa o espaço "clicar" o botão de zoom focado
  espaco = false; cv.classList.remove("mao", "puxando");
});
window.addEventListener("blur", () => { espaco = false; cv.classList.remove("mao", "puxando"); });

const CHAVE = "gerador-efeitos-v1";
function salvar(){ gravar(); registrar(); }
function gravar(){
  try{
    localStorage.setItem(CHAVE, JSON.stringify({
      lang:LANG, W:S.W, H:S.H, dpi:S.dpi, manter:S.manter, fundo:S.fundo, escala:S.escala, atual:S.atual, tiposRecolhidos:!!S.tiposRecolhidos,
      camadas:S.camadas.map(c => ({
        efeito:c.efeito, params:c.params, cor:c.cor,
        opacidade:c.opacidade, visivel:c.visivel, semente:c.semente, mascara:c.mascara, nome:c.nome || ""
      })), ref:{opac:REF.opac, pos:REF.pos, encaixe:REF.encaixe, visivel:REF.visivel}
    }));
  }catch(e){}
}
function carregar(){
  try{
    const d = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if(!d) return;
    if(d.lang && I18N[d.lang]) LANG = d.lang;
    S.W = d.W || S.W; S.H = d.H || S.H; S.dpi = d.dpi || S.dpi;
    if(typeof d.manter === "boolean") S.manter = d.manter;
    S.fundo = d.fundo || S.fundo; S.escala = d.escala || 1;
    if(Array.isArray(d.camadas) && d.camadas.length){
      S.camadas = d.camadas.filter(c => EFEITOS[c.efeito]).map(c => {
        const base = novaCamada(c.efeito);
        return Object.assign(base, c, {params:Object.assign(base.params, c.params), formas:null,
                                       mascara:Object.assign(mascaraPadrao(), c.mascara || {})});
      });
      if(!S.camadas.length) S.camadas = [novaCamada()];
    }
    S.atual = Math.min(d.atual || 0, S.camadas.length-1);
    S.tiposRecolhidos = !!d.tiposRecolhidos;
    if(d.ref) Object.assign(REF, d.ref);
  }catch(e){}
}

/* ============================================================
   11. PARTIDA
   ============================================================ */
carregar();
$("idioma").value = LANG;
$("larg").value = S.W; $("alt").value = S.H;
$("dpi").value = S.dpi; $("manter").checked = S.manter;
$("fundo").value = S.fundo;
$("escala").value = String(S.escala);
aplicarIdioma();
montarTudo();
medirPalco();
desenhar();
registrar();
lerRef().then(b => { if(b) abrirRef(b, false); });
try{ if(!localStorage.getItem(CHAVE_AJUDA)) abrirAjuda(); }catch(e){}
</script>

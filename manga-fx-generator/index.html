                         {v:"bolha",  rot:{pt:"Bolha",   en:"Bubble"}},
                         {v:"neve",   rot:{pt:"Neve",    en:"Snow"}}]},
    densidade:  {tipo:"slider", rot:{pt:"Densidade (figuras / 100 mil px²)", en:"Density (shapes / 100k px²)"}, min:1, max:80, passo:1, padrao:8},
    tamanhoMin: {tipo:"slider", rot:{pt:"Tamanho mínimo", en:"Min size"}, min:4, max:200, passo:1, padrao:18, suf:"px"},
    tamanhoMax: {tipo:"slider", rot:{pt:"Tamanho máximo", en:"Max size"}, min:6, max:300, passo:1, padrao:60, suf:"px"},
    afastamento:{tipo:"slider", rot:{pt:"Afastamento mínimo", en:"Min spacing"}, min:0, max:150, passo:1, padrao:70, suf:"%"},
    rotacao:    {tipo:"slider", rot:{pt:"Rotação sorteada",   en:"Random rotation"}, min:0, max:100, passo:1, padrao:60, suf:"%"},
    anel:       {tipo:"slider", rot:{pt:"Contorno da bolha",  en:"Bubble outline"},  min:3, max:40,  passo:1, padrao:14, suf:"%"},
    degrade:    {tipo:"slider", rot:{pt:"Degradê",            en:"Fade"},            min:0, max:100, passo:1, padrao:0,  suf:"%"},
    anguloGrad: {tipo:"slider", rot:{pt:"Direção do degradê", en:"Fade direction"},  min:0, max:360, passo:1, padrao:0,  suf:"°"}
  },
  gerar(p, W, H, rng){
    const tmin = Math.min(p.tamanhoMin, p.tamanhoMax)/2, tmax = Math.max(p.tamanhoMin, p.tamanhoMax)/2;
    const n = Math.min(20000, Math.round(W*H/1e5*p.densidade));
    const sep = p.afastamento/100, rotacao = p.rotacao/100;
    const cel = Math.max(8, 2*tmax*Math.max(1,sep) + 1);
    const fator = gradienteLinear(p.anguloGrad, W, H, 0, 1, 1, 1 - p.degrade/100);
    const grade = new Map(), formas = [];
    let postos = 0, tentativas = 0;
    // Em densidade alta o quadro enche antes de chegar a n; o limite de tentativas
    // faz o efeito simplesmente saturar, em vez de ficar procurando lugar para sempre.
    while(postos < n && tentativas < n*40){
      tentativas++;
      const R = tmin + (tmax-tmin)*Math.pow(rng(), 1.6);          // mais pequenas que grandes
      const x = -tmax + rng()*(W + 2*tmax), y = -tmax + rng()*(H + 2*tmax);
      if(rng() > fator(x,y)) continue;
      const gi = Math.floor((x+tmax)/cel), gj = Math.floor((y+tmax)/cel);
      let livre = true;
      for(let di=-1; di<=1 && livre; di++){
        for(let dj=-1; dj<=1 && livre; dj++){
          const lista = grade.get((gi+di)*100003 + (gj+dj));
          if(!lista) continue;
          for(const q of lista){ if(Math.hypot(x-q[0], y-q[1]) < (R+q[2])*sep){ livre = false; break; } }
        }
      }
      if(!livre) continue;
      const chave = gi*100003 + gj;
      if(!grade.has(chave)) grade.set(chave, []);
      grade.get(chave).push([x,y,R]);
      postos++;
      const ang = (rng()-0.5)*Math.PI*2*rotacao;
      for(const f of figuraAtmosfera(p.figura, x, y, R, ang, p, rng)) formas.push(f);
    }
    return formas;
  }
};

const ORDEM = ["concentracao","flash","betaflash","uniflash","velocidade","curvas","vento","verticais","chuva","kakeami","kakeamiGrad","linhas","reticula","reticulaGrad","padroes","pontilhado","granulado","atmosfera"];

/* ============================================================
   5. ESTADO
   ============================================================ */
const PRESETS = [
  {rot:{pt:"1920 × 1080 (paisagem)", en:"1920 × 1080 (landscape)"}, w:1920, h:1080},
  {rot:{pt:"1080 × 1920 (vertical)", en:"1080 × 1920 (portrait)"},  w:1080, h:1920},
  {rot:{pt:"1080 × 1080 (quadrado)", en:"1080 × 1080 (square)"},    w:1080, h:1080},
  {rot:{pt:"1080 × 1350 (4:5)",      en:"1080 × 1350 (4:5)"},       w:1080, h:1350},
  {rot:{pt:"B5 a 350 dpi",           en:"B5 at 350 dpi"},           w:2508, h:3541}
];

function padroesDe(efeito){
  const o = {};
  for(const [k,d] of Object.entries(EFEITOS[efeito].params)){
    o[k] = Array.isArray(d.padrao) ? d.padrao.slice() : d.padrao;
  }
  return o;
}
function novaCamada(efeito="concentracao", cor="#111111"){
  return {efeito, params:padroesDe(efeito), cor, opacidade:1, visivel:true,
          semente:(Math.random()*1e9)|0, formas:null};
}

const S = {
  W:1920, H:1080, fundo:"xadrez", escala:1,
  camadas:[novaCamada()], atual:0
};

/* ============================================================
   6. RENDERIZAÇÃO
   ============================================================ */
function formasDa(cam){
  if(cam.formas) return cam.formas;
  const ef = EFEITOS[cam.efeito];
  const t0 = performance.now();
  cam.formas = ef.gerar(cam.params, S.W, S.H, mulberry32(cam.semente));
  // Combinações pesadas existem de verdade (retícula fina em B5 a 350 dpi
  // passa de um milhão de pontos). Quando o desenho custa caro, os
  // controles passam a redesenhar só ao soltar, em vez de a cada pixel.
  cam.pesado = (performance.now() - t0) > 120;
  return cam.formas;
}
const invalidar = cam => { cam.formas = null; };

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

function desenhar(){
  cv.width = S.W; cv.height = S.H;
  ctx.clearRect(0,0,S.W,S.H);
  for(const cam of S.camadas){
    if(!cam.visivel) continue;
    desenharCanvas(ctx, formasDa(cam), cam.cor, cam.opacidade);
  }
  posicionarAlvo();
}

let pendente = false;
function redesenhar(){
  if(pendente) return;
  pendente = true;
  requestAnimationFrame(() => { pendente = false; desenhar(); });
}

function construirSVG(fundoBranco){
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${S.W}" height="${S.H}" viewBox="0 0 ${S.W} ${S.H}">`;
  if(fundoBranco) s += `<rect width="${S.W}" height="${S.H}" fill="#ffffff"/>`;
  for(const cam of S.camadas){
    if(!cam.visivel) continue;
    s += formasParaSVG(formasDa(cam), cam.cor, cam.opacidade);
  }
  return s + "</svg>";
}

function paraCanvas(escala, fundoBranco){
  const c = document.createElement("canvas");
  c.width = Math.round(S.W*escala); c.height = Math.round(S.H*escala);
  const x = c.getContext("2d");
  if(fundoBranco){ x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); }
  x.scale(escala, escala);
  for(const cam of S.camadas){
    if(!cam.visivel) continue;
    desenharCanvas(x, formasDa(cam), cam.cor, cam.opacidade);
  }
  return c;
}

/* ============================================================
   7. INTERFACE
   ============================================================ */
const $ = id => document.getElementById(id);
const camAtual = () => S.camadas[S.atual];

function statusMsg(txt){
  $("status").textContent = txt;
  clearTimeout(statusMsg._t);
  statusMsg._t = setTimeout(() => { $("status").textContent = ""; }, 4000);
}

/* --- Botões de tipo --- */
function montarTipos(){
  const box = $("tipos"); box.innerHTML = "";
  for(const id of ORDEM){
    const ef = EFEITOS[id];
    const b = document.createElement("button");
    b.className = "tipo" + (camAtual().efeito === id ? " on" : "");
    b.innerHTML = `<svg viewBox="0 0 34 26">${ef.icone}</svg><span>${L(ef.nome)}</span>`;
    b.onclick = () => {
      const c = camAtual();
      c.efeito = id; c.params = padroesDe(id); invalidar(c);
      montarTudo(); redesenhar(); salvar();
    };
    box.appendChild(b);
  }
}

/* --- Sliders e seletores, gerados a partir de params --- */
function montarCtls(){
  const box = $("ctls"); box.innerHTML = "";
  const c = camAtual();
  const ef = EFEITOS[c.efeito];
  for(const [chave, d] of Object.entries(ef.params)){
    if(d.tipo === "slider"){
      const div = document.createElement("div"); div.className = "ctl";
      div.innerHTML =
        `<div class="top"><label>${L(d.rot)}</label><span class="val">${c.params[chave]}${d.suf||""}</span></div>`;
      const inp = document.createElement("input");
      inp.type = "range"; inp.min = d.min; inp.max = d.max; inp.step = d.passo;
      inp.value = c.params[chave];
      inp.oninput = () => {
        c.params[chave] = parseFloat(inp.value);
        div.querySelector(".val").textContent = inp.value + (d.suf||"");
        invalidar(c);
        if(c.pesado) statusMsg(T("pesado")); else redesenhar();
      };
      inp.onchange = () => { redesenhar(); salvar(); };
      div.appendChild(inp); box.appendChild(div);
    } else if(d.tipo === "opcoes"){
      const div = document.createElement("div"); div.className = "ctl";
      div.innerHTML = `<div class="top"><label>${L(d.rot)}</label></div>`;
      const sel = document.createElement("select");
      sel.style.width = "100%";
      for(const o of d.opcoes){
        const op = document.createElement("option");
        op.value = o.v; op.textContent = L(o.rot);
        if(c.params[chave] === o.v) op.selected = true;
        sel.appendChild(op);
      }
      sel.onchange = () => { c.params[chave] = sel.value; invalidar(c); redesenhar(); salvar(); };
      div.appendChild(sel); box.appendChild(div);
    } else if(d.tipo === "ponto"){
      const dica = document.createElement("div");
      dica.className = "dica"; dica.textContent = T("arraste");
      box.appendChild(dica);
    }
  }
  // Opacidade da camada
  const div = document.createElement("div"); div.className = "ctl";
  div.innerHTML = `<div class="top"><label>${LANG==="pt"?"Opacidade":"Opacity"}</label>
                   <span class="val">${Math.round(c.opacidade*100)}%</span></div>`;
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = 5; inp.max = 100; inp.step = 1; inp.value = c.opacidade*100;
  inp.oninput = () => {
    c.opacidade = parseFloat(inp.value)/100;
    div.querySelector(".val").textContent = inp.value + "%";
    redesenhar();
  };
  inp.onchange = salvar;
  div.appendChild(inp); box.appendChild(div);
}

/* --- Lista de camadas --- */
function montarCamadas(){
  const box = $("camadas"); box.innerHTML = "";
  S.camadas.forEach((cam, i) => {
    const el = document.createElement("div");
    el.className = "cam" + (i === S.atual ? " on" : "") + (cam.visivel ? "" : " off");
    el.onclick = e => {
      if(e.target.closest("input,button")) return;
      S.atual = i; montarTudo();
    };
    const cor = document.createElement("input");
    cor.type = "color"; cor.value = cam.cor;
    cor.oninput = () => { cam.cor = cor.value; redesenhar(); };
    cor.onchange = salvar;

    const nome = document.createElement("span");
    nome.className = "nome";
    nome.textContent = `${i+1}. ${L(EFEITOS[cam.efeito].nome)}`;

    const olho = document.createElement("button");
    olho.className = "ic"; olho.textContent = cam.visivel ? "👁" : "🚫";
    olho.onclick = () => { cam.visivel = !cam.visivel; montarCamadas(); redesenhar(); salvar(); };

    const sobe = document.createElement("button");
    sobe.className = "ic"; sobe.textContent = "↑"; sobe.disabled = i === 0;
    sobe.onclick = () => {
      if(i === 0) return;
      [S.camadas[i-1], S.camadas[i]] = [S.camadas[i], S.camadas[i-1]];
      S.atual = i-1; montarTudo(); redesenhar(); salvar();
    };

    const apaga = document.createElement("button");
    apaga.className = "ic"; apaga.textContent = "✕"; apaga.disabled = S.camadas.length === 1;
    apaga.onclick = () => {
      if(S.camadas.length === 1) return;
      S.camadas.splice(i,1);
      S.atual = Math.min(S.atual, S.camadas.length-1);
      montarTudo(); redesenhar(); salvar();
    };

    el.append(cor, nome, olho, sobe, apaga);
    box.appendChild(el);
  });
}

/* --- Centro arrastável --- */
function temCentro(){
  return "centro" in EFEITOS[camAtual().efeito].params;
}
function posicionarAlvo(){
  const a = $("alvo");
  if(!temCentro()){ a.style.display = "none"; return; }
  const r = cv.getBoundingClientRect();
  const p = camAtual().params.centro;
  a.style.display = "block";
  a.style.left = (p[0]*r.width) + "px";
  a.style.top  = (p[1]*r.height) + "px";
}
let arrastando = false;
function mover(e){
  const r = cv.getBoundingClientRect();
  const c = camAtual();
  c.params.centro = [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height];
  invalidar(c); redesenhar();
}
cv.addEventListener("pointerdown", e => {
  if(!temCentro()) return;
  arrastando = true; cv.setPointerCapture(e.pointerId); mover(e);
});
cv.addEventListener("pointermove", e => { if(arrastando) mover(e); });
cv.addEventListener("pointerup", () => { if(arrastando){ arrastando = false; salvar(); } });
window.addEventListener("resize", posicionarAlvo);

/* --- Textos fixos da interface --- */
function aplicarIdioma(){
  document.documentElement.lang = LANG === "pt" ? "pt-BR" : "en";
  const map = {
    "t-titulo":"titulo","t-tipo":"tipo","t-ajustes":"ajustes","t-camadas":"camadas",
    "t-doc":"doc","t-tamanho":"tamanho","t-fundo":"fundo","t-exportar":"exportar",
    "t-escala":"escala","t-variar":"variar","t-reset":"reset","t-add":"add",
    "t-png-t":"pngT","t-png-b":"pngB","t-copiar":"copiar"
  };
  for(const [id,k] of Object.entries(map)) $(id).textContent = T(k);
  document.title = T("titulo");
  const f = $("fundo");
  f.options[0].textContent = T("xadrez");
  f.options[1].textContent = T("branco");
  f.options[2].textContent = T("preto");
  montarPresets();
}
function montarPresets(){
  const sel = $("preset");
  const atual = sel.value;
  sel.innerHTML = "";
  PRESETS.forEach((p,i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = L(p.rot);
    sel.appendChild(o);
  });
  const o = document.createElement("option");
  o.value = "x"; o.textContent = T("personalizado");
  sel.appendChild(o);
  const achou = PRESETS.findIndex(p => p.w === S.W && p.h === S.H);
  sel.value = achou >= 0 ? String(achou) : (atual || "x");
}

function montarTudo(){ montarTipos(); montarCtls(); montarCamadas(); }

/* ============================================================
   8. EXPORTAÇÃO
   ============================================================ */
function baixar(blob, nome){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  statusMsg(T("salvo") + " " + nome);
}
function carimbo(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function exportarPNG(fundoBranco){
  paraCanvas(S.escala, fundoBranco).toBlob(b => {
    baixar(b, `efeito-${carimbo()}${fundoBranco?"-branco":""}.png`);
  }, "image/png");
}
$("b-png-t").onclick = () => exportarPNG(false);
$("b-png-b").onclick = () => exportarPNG(true);
$("b-svg").onclick = () => {
  const svg = construirSVG(false);
  const mb = svg.length/1048576;
  baixar(new Blob([svg], {type:"image/svg+xml;charset=utf-8"}), `efeito-${carimbo()}.svg`);
  if(mb > 12) setTimeout(() => statusMsg(T("svgGrande").replace("{}", mb.toFixed(0))), 120);
};
$("b-copiar").onclick = () => {
  paraCanvas(S.escala, false).toBlob(async b => {
    try{
      await navigator.clipboard.write([new ClipboardItem({"image/png": b})]);
      statusMsg(T("copiado"));
    }catch(e){ statusMsg(T("erroCopia")); }
  }, "image/png");
};

/* ============================================================
   9. CONTROLES GERAIS
   ============================================================ */
$("b-variar").onclick = () => {
  const c = camAtual();
  if(!EFEITOS[c.efeito].aleatorio){ statusMsg(T("semAleatorio")); return; }
  c.semente = (Math.random()*1e9)|0;
  invalidar(c); redesenhar(); salvar();
};
$("b-reset").onclick = () => {
  const c = camAtual();
  c.params = padroesDe(c.efeito); c.opacidade = 1;
  invalidar(c); montarCtls(); redesenhar(); salvar();
};
$("b-add").onclick = () => {
  if(S.camadas.length >= 8){ statusMsg(T("limite")); return; }
  S.camadas.push(novaCamada("reticula", "#111111"));
  S.atual = S.camadas.length - 1;
  montarTudo(); redesenhar(); salvar();
};
$("idioma").onchange = e => { LANG = e.target.value; aplicarIdioma(); montarTudo(); salvar(); };
$("fundo").onchange = e => {
  S.fundo = e.target.value;
  $("wrap").className = S.fundo;
  salvar();
};
$("escala").onchange = e => { S.escala = parseFloat(e.target.value); salvar(); };
$("preset").onchange = e => {
  if(e.target.value === "x") return;
  const p = PRESETS[parseInt(e.target.value,10)];
  aplicarTamanho(p.w, p.h);
};
function aplicarTamanho(w,h){
  S.W = Math.max(64, Math.min(6000, Math.round(w)));
  S.H = Math.max(64, Math.min(6000, Math.round(h)));
  $("larg").value = S.W; $("alt").value = S.H;
  S.camadas.forEach(invalidar);
  montarPresets(); redesenhar(); salvar();
}
$("larg").onchange = () => aplicarTamanho(parseInt($("larg").value,10)||S.W, S.H);
$("alt").onchange  = () => aplicarTamanho(S.W, parseInt($("alt").value,10)||S.H);

/* ============================================================
   10. PERSISTÊNCIA (localStorage)
   ============================================================ */
const CHAVE = "gerador-efeitos-v1";
function salvar(){
  try{
    localStorage.setItem(CHAVE, JSON.stringify({
      lang:LANG, W:S.W, H:S.H, fundo:S.fundo, escala:S.escala, atual:S.atual,
      camadas:S.camadas.map(c => ({
        efeito:c.efeito, params:c.params, cor:c.cor,
        opacidade:c.opacidade, visivel:c.visivel, semente:c.semente
      }))
    }));
  }catch(e){}
}
function carregar(){
  try{
    const d = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if(!d) return;
    if(d.lang && I18N[d.lang]) LANG = d.lang;
    S.W = d.W || S.W; S.H = d.H || S.H;
    S.fundo = d.fundo || S.fundo; S.escala = d.escala || 1;
    if(Array.isArray(d.camadas) && d.camadas.length){
      S.camadas = d.camadas.filter(c => EFEITOS[c.efeito]).map(c => {
        const base = novaCamada(c.efeito);
        return Object.assign(base, c, {params:Object.assign(base.params, c.params), formas:null});
      });
      if(!S.camadas.length) S.camadas = [novaCamada()];
    }
    S.atual = Math.min(d.atual || 0, S.camadas.length-1);
  }catch(e){}
}

/* ============================================================
   11. PARTIDA
   ============================================================ */
carregar();
$("idioma").value = LANG;
$("larg").value = S.W; $("alt").value = S.H;
$("fundo").value = S.fundo; $("wrap").className = S.fundo;
$("escala").value = String(S.escala);
aplicarIdioma();
montarTudo();
desenhar();
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gerador de Cabeças</title>
<style>
:root{--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--bg:#f3f1ec;--panel:#fff;--ink:#1d1d1f;--muted:#6d6c70;--line:#e4e1da;--chip:#f0eee8;--on:#fff;--accent:#e0474c;--paper:#fbfaf6;--dot:rgba(0,0,0,.07);--glass:rgba(255,255,255,.9);--glass-ink:#2a2a2e;--glass-muted:#6f6d68;--glass-line:#e4e1da;--glass-hover:#f0eee8}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--panel:#1f1f22;--ink:#ececee;--muted:#9a9aa1;--line:#323237;--chip:#2a2a2e;--on:#3b3b41;color-scheme:dark;
  --paper:#1c1c1f;--dot:rgba(255,255,255,.07);--glass:rgba(38,38,42,.92);--glass-ink:#ececee;--glass-muted:#a3a1a8;--glass-line:#3a3a40;--glass-hover:#34343a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 var(--font);-webkit-text-size-adjust:100%}
#app{display:grid;grid-template-columns:1fr 360px;height:100vh;height:100dvh}
#stage{position:relative;background:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;overflow:hidden;min-height:0}
#ref{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;opacity:.35;transform-origin:50% 50%}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#view{position:relative;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#view:active{cursor:grabbing}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--glass-muted);background:var(--glass);padding:4px 10px;border-radius:20px;pointer-events:none;white-space:nowrap}
.readout{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--glass-muted);background:var(--glass);padding:4px 10px;border-radius:8px;pointer-events:none;font-variant-numeric:tabular-nums}
#panel{overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding-bottom:48px;-webkit-overflow-scrolling:touch}
.ph{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 10px;gap:10px}
.ph h1{font-size:18px;margin:0;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted);font-size:12px}
.lang{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.lang button{border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--font);padding:6px 8px;border-radius:6px;cursor:pointer}
.lang button.on{background:var(--on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-weight:400;font-size:16px}
details[open] summary::after{content:"–"}
.body{padding:0 16px 14px}
.lbl{font-size:12px;color:var(--muted);margin:4px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--chip);padding:3px;border-radius:10px;margin-bottom:10px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--on);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.note{font-size:12px;color:var(--muted);margin:2px 0 10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;padding:8px 10px;border-radius:9px;cursor:pointer}
.btn:hover{background:var(--chip)}
.btn.wide{width:100%}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.row{padding:5px 0}
.row .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);cursor:default}
.row .lab b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0;height:22px}
.tog{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.colorrow{display:flex;align-items:center;gap:10px;margin:-2px 0 10px}
.colorrow input{width:44px;height:30px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.exp{display:grid;gap:6px}
.drop{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:10px;cursor:pointer;margin-bottom:6px}
.drop.over{border-color:var(--accent)}
.drop img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--chip);flex:none}
.drop span{font-size:13px;color:var(--muted);min-width:0}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.foot{font-size:11px;color:var(--muted);padding:12px 16px 0}
[hidden]{display:none!important}
button,input,select,label,summary,.lpad{touch-action:manipulation}
.hdr-act{display:flex;gap:6px;align-items:center}
.ib{border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:32px;height:30px;border-radius:8px;font-size:15px;line-height:1;cursor:pointer;padding:0 6px}
.ib:disabled{opacity:.35;cursor:default}
.tabs{display:flex;padding:0 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:4;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--muted);font:600 12px/1 var(--font);padding:13px 7px 10px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px 16px 6px}
.pane details{border-top:1px solid var(--line);margin:0 -16px}
.pane details summary{padding:11px 16px;font-size:12px}
.pane details .body{padding:0 16px 12px}
.adv{margin-top:10px!important}
.adv>summary{color:var(--ink)}
.adv details summary{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px;padding-left:24px}
.adv details .body{padding-left:24px}
.modrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--chip);border-radius:9px;padding:5px 5px 5px 10px;font-size:12px;margin:0 0 10px}
.modrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:7px}
.modrow .btn{padding:6px 10px;font-size:12px}
.prow{display:flex;gap:6px;margin-bottom:6px}
.prow select,.prow input{flex:1;min-width:0;font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.prow .btn{padding:7px 10px;font-size:12px;white-space:nowrap}
.lv{display:flex;align-items:center;gap:6px}
.nmw{display:flex;align-items:center;gap:7px;min-width:0}
.nb{flex:none;min-width:19px;height:19px;border-radius:10px;border:2px solid var(--nc);color:var(--nc);font:700 10.5px/15px var(--font);text-align:center;padding:0 3px;background:var(--panel)}
body.nonums .nb{display:none}
.row.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:rgba(224,71,76,.18)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.row.flash{animation:none;outline:2px solid var(--accent)}}
.rs{border:0;background:var(--chip);color:var(--muted);border-radius:6px;font-size:12px;line-height:1;padding:3px 6px;cursor:pointer}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--panel);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
:where(button,input,select,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.help{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.help[hidden]{display:none}
.help .card{background:var(--panel);color:var(--ink);border-radius:14px;max-width:460px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px 22px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.help h2{margin:0 0 10px;font-size:17px}
.help ol{margin:0 0 16px;padding-left:20px;font-size:14px;line-height:1.45}
.help li{margin:0 0 8px}
.help .btn{width:100%}
.toast{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:#2a2a2e;color:#fff;border-radius:10px;padding:7px 7px 7px 14px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 24px)}
.toast button{border:0;background:#fff;color:#2a2a2e;font:600 12px/1 var(--font);padding:7px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
/* floating bar, orientation, badges */
.fbar{position:absolute;right:10px;bottom:10px;display:flex;gap:2px;align-items:center;background:var(--glass);border:1px solid var(--glass-line);border-radius:12px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:3}
.fbar button{border:0;background:none;color:var(--glass-ink);font:600 12px/1 var(--font);padding:8px 9px;border-radius:8px;cursor:pointer;min-width:32px}
.fbar button:hover{background:var(--glass-hover)}.fbar button.on{background:var(--glass-ink);color:var(--paper)}.fbar button:disabled{opacity:.3;cursor:default}
.fbar i{width:1px;height:20px;background:var(--glass-line);margin:0 3px}
#gizmo{position:absolute;right:10px;top:10px;width:64px;height:64px;pointer-events:none}
.mbadge{position:absolute;top:10px;left:50%;transform:translateX(-50%);border:0;background:var(--accent);color:#fff;font:600 12px/1 var(--font);padding:9px 13px;border-radius:20px;cursor:pointer;z-index:4;white-space:nowrap}
.mdesc{font-size:12px;color:var(--muted);margin:-4px 0 12px;line-height:1.4}
.lpwrap{display:flex;gap:14px;align-items:center;margin:2px 0 8px}
.lpad{position:relative;flex:none;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#f4f2ee,#c9c5bd 60%,#8b877f);touch-action:none;cursor:pointer;border:1px solid var(--line)}
.ldot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#ffd84a;border:2px solid #2a2a2e;box-shadow:0 0 0 4px rgba(255,216,74,.35);pointer-events:none}
.ldot.back{background:#fff;border-style:dashed}
@media (max-width:860px){
  .tabs{top:50vh}
  .readout{bottom:auto;top:10px;left:10px}
  .hint{display:none}
  html,body{height:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  #stage{position:sticky;top:0;height:50vh;z-index:5;border-bottom:1px solid var(--line)}
  #panel{border-left:0;overflow:visible}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <img id="ref" alt="" hidden>
    <canvas id="gl"></canvas>
    <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="hint" data-i18n="hint"></div>
    <div class="readout" id="readout"></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <svg id="gizmo" viewBox="-32 -32 64 64" aria-hidden="true"></svg>
    <button class="mbadge" id="mbadge" hidden data-i18n="ref_badge"></button>
    <div class="fbar" id="fbar">
      <button data-act="undo" data-tip="undo">↶</button><button data-act="redo" data-tip="redo">↷</button><i></i>
      <button data-q="0" data-i18n="q_front"></button><button data-q="1" data-i18n="q_34"></button><button data-q="2" data-i18n="q_prof"></button><i></i>
      <button id="fb-center" data-tip="center">⌖</button><button id="fb-solid" data-i18n="fb_solid"></button>
    </div>
  </div>
  <div class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="help-t" hidden><div class="card">
    <h2 id="help-t" data-i18n="help_t"></h2>
    <ol><li data-i18n="help_1"></li><li data-i18n="help_2"></li><li data-i18n="help_3"></li><li data-i18n="help_4"></li><li data-i18n="help_5"></li><li data-i18n="help_6"></li></ol>
    <button class="btn primary" id="help-ok" data-i18n="help_ok"></button>
  </div></div>
  <aside id="panel">
    <header class="ph">
      <div><h1 data-i18n="title"></h1><p data-i18n="sub"></p></div>
      <div class="hdr-act">
        <button class="ib" data-act="undo" data-tip="undo">↶</button><button class="ib" data-act="redo" data-tip="redo">↷</button>
        <button class="ib" id="btn-help" data-tip="help">?</button><div class="lang"><button data-lang="pt">PT</button><button data-lang="en">EN</button></div>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button data-tab="model" data-i18n="tab_model"></button><button data-tab="view" data-i18n="tab_view"></button><button data-tab="light" data-i18n="tab_light"></button><button data-tab="guides" data-i18n="tab_guides"></button><button data-tab="ref" data-i18n="tab_ref"></button><button data-tab="export" data-i18n="tab_export"></button>
    </nav>

    <section class="pane" data-pane="model">
      <div class="lbl" data-i18n="method"></div>
      <div class="seg" id="seg-method">
        <button data-val="loomis" data-i18n="m_loomis"></button>
        <button data-val="box" data-i18n="m_box"></button>
        <button data-val="atari" data-i18n="m_atari"></button>
        <button data-val="fifths" data-i18n="m_fifths"></button>
        <button data-val="reilly" data-i18n="m_reilly"></button>
        <button data-val="bridgman" data-i18n="m_bridgman"></button>
      </div>
      <p class="mdesc" id="mdesc"></p>
      <div class="lbl" data-i18n="style"></div>
      <div class="seg" id="seg-style">
        <button data-val="loomis" data-i18n="st_loomis"></button>
        <button data-val="manga" data-i18n="st_manga"></button>
        <button data-val="real" data-i18n="st_real"></button>
      </div>
      <div class="lbl" data-i18n="base"></div>
      <div class="seg" id="seg-base">
        <button data-val="masc" data-i18n="b_masc"></button>
        <button data-val="fem" data-i18n="b_fem"></button>
        <button data-val="inf" data-i18n="b_inf"></button>
      </div>
      <div class="modrow" id="modrow" hidden><span><i></i><span data-i18n="mod"></span></span><button class="btn" id="btn-reset" data-i18n="restore"></button></div>
      <div class="lbl" data-i18n="presets"></div>
      <div class="prow"><select id="psel" aria-label="presets"></select><button class="btn" id="p-apply" data-i18n="p_apply"></button><button class="btn" id="p-del" data-i18n="p_del"></button></div>
      <div class="prow"><input id="pname" type="text" maxlength="40" data-ph="p_name"><button class="btn" id="p-save" data-i18n="p_save"></button></div>
      <label class="tog" style="padding-top:0"><input type="checkbox" id="pscene"><span data-i18n="p_scene"></span></label>
      <div class="prow"><button class="btn" id="p-export" style="flex:1" data-i18n="p_export"></button><button class="btn" id="p-import" style="flex:1" data-i18n="p_import"></button></div>
      <input type="file" id="p-file" accept="application/json,.json" hidden>
      <details class="adv" id="adv"><summary data-i18n="adv"></summary>
        <details id="sec-cran"><summary data-i18n="sec_cran"></summary><div class="body"><div class="sl"></div></div></details>
        <details id="sec-face"><summary data-i18n="sec_face"></summary><div class="body"><div class="sl"></div></div></details>
        <details id="sec-jaw"><summary data-i18n="sec_jaw"></summary><div class="body"><div class="sl"></div></div></details>
        <details id="sec-feat"><summary data-i18n="sec_feat"></summary><div class="body"><div class="sl"></div></div></details>
        <details id="sec-neck"><summary data-i18n="sec_neck"></summary><div class="body"><div class="sl"></div></div></details>
      </details>
    </section>

    <section class="pane" data-pane="view" id="sec-ang" hidden>
      <div class="quick" id="quick"></div>
      <button class="btn wide" id="btn-center" style="margin-bottom:6px" data-i18n="center"></button>
      <label class="tog"><input type="checkbox" id="snapon"><span data-i18n="snap"></span></label>
      <div class="sl"></div>
    </section>

    <section class="pane" data-pane="light" id="sec-solid" hidden>
      <label class="tog"><input type="checkbox" id="solidon"><span data-i18n="solid_show"></span></label>
      <div class="lbl" data-i18n="shade"></div>
      <div class="seg" id="seg-shade" style="grid-template-columns:1fr 1fr"><button data-val="flat" data-i18n="sh_flat"></button><button data-val="smooth" data-i18n="sh_smooth"></button></div>
      <div class="lbl" data-i18n="tones"></div>
      <div class="seg" id="seg-tones" style="grid-template-columns:repeat(4,1fr)"><button data-val="0" data-i18n="t_cont"></button><button data-val="2">2</button><button data-val="3">3</button><button data-val="4">4</button></div>
      <div class="colorrow"><input type="color" id="matcol"><span class="note" style="margin:0" data-i18n="mat"></span></div>
      <div class="lpwrap"><div class="lpad" id="lpad"><div class="ldot" id="ldot"></div></div><p class="note" data-i18n="lpad"></p></div>
      <div class="lbl" data-i18n="lpre"></div>
      <div class="seg" id="seg-lpre" style="grid-template-columns:repeat(4,1fr)"><button data-lp="std" data-i18n="lp_std"></button><button data-lp="rem" data-i18n="lp_rem"></button><button data-lp="side" data-i18n="lp_side"></button><button data-lp="top" data-i18n="lp_top"></button><button data-lp="low" data-i18n="lp_low"></button><button data-lp="rim" data-i18n="lp_rim"></button><button data-lp="flat" data-i18n="lp_flat"></button></div>
      <div class="sl"></div>
      <p class="note" id="nogl" hidden data-i18n="nogl"></p>
    </section>

    <section class="pane" data-pane="guides" id="sec-disp" hidden>
      <div id="groups"></div>
      <div class="lbl" data-i18n="nums"></div>
      <div class="seg" id="seg-nums"><button data-val="open" data-i18n="nm_open"></button><button data-val="all" data-i18n="nm_all"></button><button data-val="off" data-i18n="nm_off"></button></div>
      <p class="note" style="margin-top:-4px" data-i18n="nums_note"></p>
      <label class="tog"><input type="checkbox" id="haloon"><span data-i18n="halo"></span></label>
      <div class="lbl" data-i18n="hidden"></div>
      <div class="seg" id="seg-hidden">
        <button data-val="dash" data-i18n="h_dash"></button>
        <button data-val="hide" data-i18n="h_hide"></button>
        <button data-val="xray" data-i18n="h_xray"></button>
      </div>
      <div class="lbl" data-i18n="colors"></div>
      <div class="seg" id="seg-color" style="grid-template-columns:1fr 1fr">
        <button data-val="group" data-i18n="c_group"></button>
        <button data-val="mono" data-i18n="c_mono"></button>
      </div>
      <div class="colorrow" id="monorow"><input type="color" id="mono"><span class="note" style="margin:0" data-i18n="c_pick"></span></div>
      <div class="lbl" data-i18n="palette"></div>
      <div class="seg" id="seg-pal" style="grid-template-columns:1fr 1fr"><button data-val="std" data-i18n="pal_std"></button><button data-val="cb" data-i18n="pal_cb"></button></div>
      <div class="sl"></div>
    </section>

    <section class="pane" data-pane="ref" hidden>
      <label class="drop" id="drop" for="file"><img id="thumb" alt="" hidden><span id="droptxt" data-i18n="drop"></span></label>
      <input type="file" id="file" accept="image/*" hidden>
      <div id="refctl" hidden>
        <label class="tog"><input type="checkbox" id="refon" checked><span data-i18n="ref_show"></span></label>
        <button class="btn wide" id="btn-move" data-i18n="ref_move"></button>
        <div class="sl" id="refsl"></div>
        <div class="quick" style="grid-template-columns:1fr 1fr;margin-top:6px"><button class="btn" id="btn-refreset" data-i18n="ref_reset"></button><button class="btn" id="btn-refdel" data-i18n="ref_del"></button></div>
      </div>
    </section>

    <section class="pane" data-pane="export" hidden>
      <div class="lbl" data-i18n="exp_bg"></div>
      <div class="seg" id="seg-expbg" style="grid-template-columns:1fr 1fr"><button data-val="t" data-i18n="bg_t"></button><button data-val="w" data-i18n="bg_w"></button></div>
      <div class="lbl" data-i18n="exp_size"></div>
      <div class="seg" id="seg-expsize"><button data-val="1024">1024 px</button><button data-val="2048">2048 px</button><button data-val="4096">4096 px</button></div>
      <label class="tog"><input type="checkbox" id="cropon"><span data-i18n="exp_crop"></span></label>
      <div class="exp">
        <button class="btn primary wide" id="ex-png" data-i18n="exp_dl"></button>
        <button class="btn wide" id="ex-copy" data-i18n="exp_copy"></button>

    S.zoom=S.zoom*m/m2;S.panX=(W/2+ox-box.x-box.w/2)/m2;S.panY=(H/2+oy-box.y-box.h/2)/m2;
    const sc=Math.min(target/Math.max(box.w,box.h),GL.max/box.w,GL.max/box.h,Math.sqrt(MAXPX/(box.w*box.h)),8);
    try{return await snapshot(box.w,box.h,sc,bg)}finally{[S.zoom,S.panX,S.panY]=keep}}
  const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
  // bounding box of everything drawn (solid + guides), from a transparent low-res pass
  function alphaBox(cv){try{const w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;
      for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
      return x1<0?null:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1}}catch(e){return null}}
  async function makePNG(){const W=svg.clientWidth,H=svg.clientHeight,target=+S.expSize||2048;
    try{let box={x:0,y:0,w:W,h:H};
      if(S.expCrop!==false){const b=alphaBox(await snapshot(W,H,1,null));if(b){const m=Math.max(b.w,b.h)*.06,x0=Math.max(0,b.x-m),y0=Math.max(0,b.y-m);box={x:x0,y:y0,w:Math.min(W,b.x+b.w+m)-x0,h:Math.min(H,b.y+b.h+m)-y0}}}
      return await toBlob(await renderRegion(W,H,box,target,bgCol()))}finally{request()}}
  // model sheet: named views, or an angle grid (columns turn the head, rows tilt it from looking up to looking down)
  function sheetCells(){const k=S.sheetN;
    if(k==='grid3'||k==='grid5'){const yaws=k==='grid3'?[-60,0,60]:[-90,-45,0,45,90],pitches=k==='grid3'?[-40,0,40]:[-60,-30,0,30,60];
      const cells=[];for(const p of pitches)for(const y of yaws)cells.push({y,p,label:`${lab('yaw')} ${y}° · ${lab('pitch').split(' (')[0]} ${p}°`});
      return{cells,cols:yaws.length,C:k==='grid3'?640:520,small:true}}
    let vs;if(k==='pick'){const on=new Set(S.sheetViews||[]);vs=VIEWS.filter(v=>on.has(v[0]))}else vs=VIEWS.slice(0,k==='6'?6:4);
    const n=vs.length,cells=vs.map(([key,y,p])=>({y,p,label:t(key)}));
    // one row per style: same views, each style from its own starting point
    if(S.sheetSty){const out=[];for(const st of Object.keys(STYLES))for(const c of cells)out.push({...c,style:st,label:`${t('st_'+st)} · ${c.label}`});return{cells:out,cols:n,C:n>4?460:560,small:false}}
    return{cells,cols:n<=3?n:n===4?2:3,C:700,small:false}}
  async function makeSheet(pv){const{cells,cols,C,small}=sheetCells();if(!cells.length){toast(t('sheet_min'));return null}const k=pv?Math.min(.3,700/(cols*C)):1,rows=Math.ceil(cells.length/cols),showLbl=!small||S.sheetLbl!==false;
    const pad=small?16:28,lblH=showLbl?(small?30:44):0,headH=76,bg=bgCol();
    const out=document.createElement('canvas');out.width=Math.round((cols*C+(cols+1)*pad)*k);out.height=Math.round((headH+rows*(C+lblH)+rows*pad)*k);const cx=out.getContext('2d');cx.scale(k,k);const OW=out.width/k;
    if(bg){cx.fillStyle=bg;cx.fillRect(0,0,OW,out.height/k)}
    const font='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
    cx.fillStyle='#1d1d1f';cx.font=`600 30px ${font}`;cx.textBaseline='alphabetic';cx.textAlign='left';cx.fillText(t('title'),pad,50);
    cx.fillStyle='#6d6c70';cx.font=`400 22px ${font}`;cx.textAlign='right';cx.fillText(S.sheetSty&&!small?`${t('m_'+S.method)} · ${t('b_'+S.base)}`:`${t('m_'+S.method)} · ${t('st_'+S.style)} · ${t('b_'+S.base)}`,OW-pad,50);
    const keep=[S.yaw,S.pitch,S.roll,S.zoom,S.panX,S.panY,S.solid],keepP={style:S.style};PKEYS.forEach(k=>keepP[k]=S[k]);let cur=S.style;
    anim=null;S.zoom=small?112:122;S.panX=S.panY=0;const sc=S.sheetC||'both';if(sc==='guides')S.solid=false;if(sc==='solid'&&GL.ok)S.solid=true;
    try{for(let i=0;i<cells.length;i++){const c=cells[i];S.yaw=c.y;S.pitch=c.p;S.roll=0;
        if(c.style&&c.style!==cur){Object.assign(S,presetValues(c.style,S.base));S.style=c.style;cur=c.style;rebuild()}else if(S.solid!==keep[6]||i===0)rebuild();
        const cv=await snapshot(C,C,k,null,sc==='solid'),x=pad+(i%cols)*(C+pad),yy=headH+Math.floor(i/cols)*(C+lblH+pad);
        cx.drawImage(cv,x,yy,C,C);
        if(showLbl){cx.fillStyle='#4a4a4f';cx.font=`500 ${small?18:24}px ${font}`;cx.textAlign='center';cx.fillText(c.label,x+C/2,yy+C+(small?22:34))}}}
    finally{[S.yaw,S.pitch,S.roll,S.zoom,S.panX,S.panY,S.solid]=keep;Object.assign(S,keepP);rebuild();request()}
    return pv?out:toBlob(out)}
  async function run(btn,job,name){if(btn.disabled)return;btn.disabled=true;const old=btn.textContent;btn.textContent=t('working');
    try{const blob=await job();if(blob)download(blob,name)}finally{btn.disabled=false;btn.textContent=old}}
  $('#ex-png').addEventListener('click',e=>run(e.currentTarget,makePNG,`cabeca_${stamp()}_${Math.round(S.yaw)}.png`));
  $('#ex-glb').addEventListener('click',()=>download(new Blob([buildGLB($('#glbpose').checked,$('#glbguides').checked)],{type:'model/gltf-binary'}),`cabeca_${stamp()}.glb`));
  $('#ex-copy').addEventListener('click',()=>{if(!navigator.clipboard||!window.ClipboardItem){toast(t('copy_fail'));return}
    navigator.clipboard.write([new ClipboardItem({'image/png':makePNG()})]).then(()=>toast(t('copied')),()=>toast(t('copy_fail')))});
  $('#ex-svg').addEventListener('click',()=>download(new Blob([svgDoc(svg.clientWidth,svg.clientHeight,S.expBg==='w'?'#ffffff':null)],{type:'image/svg+xml'}),`cabeca_${stamp()}_${Math.round(S.yaw)}.svg`));
  $('#ex-sheetpv').addEventListener('click',async e=>{const btn=e.currentTarget;if(btn.disabled)return;btn.disabled=true;const old=btn.textContent;btn.textContent=t('working');
    try{const cv=await makeSheet(true);if(cv){const im=$('#sheetpv');im.src=cv.toDataURL('image/png');im.hidden=false;im.style.opacity=1;im.title='';im.alt=t('sheet_pv')}}finally{btn.disabled=false;btn.textContent=old}});
  // any change to the sheet options greys out an old preview
  const pvStale=()=>{const im=$('#sheetpv');if(!im.hidden){im.style.opacity=.35;im.title=t('sheet_pvold')}};
  ['#seg-sheet','#seg-sheetc','#sheetviews','#seg-expbg'].forEach(q=>$(q).addEventListener('click',pvStale));['#sheetsty','#sheetlbl'].forEach(q=>$(q).addEventListener('change',pvStale));
  $('#ex-sheet').addEventListener('click',e=>run(e.currentTarget,makeSheet,`${String(S.sheetN).startsWith('grid')?'grade-de-angulos':'folha-de-modelo'}_${stamp()}.png`));

  new ResizeObserver(request).observe(svg);
  if(darkQ.addEventListener)darkQ.addEventListener('change',()=>{renderGroups();request()});
  renderGroups();syncAll();applyLang();setTab(S.tab||'model');commit();request();
})()}
</script>
</body>
